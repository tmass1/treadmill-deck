.cb-lv__row:hover .cb-lv__pick, .cb-lv__row.is-active .cb-lv__pick, .cb-lv__pick.is-on, .cb-lv.has-picked .cb-lv__pick { opacity: 1; }
.cb-lv__prefix { flex: none; min-width: 4.5em; font-family: var(--font-mono); font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); }
.cb-lv__icon { flex: none; display: inline-grid; place-items: center; width: var(--cb-icon); height: var(--cb-icon); color: var(--muted-foreground); }
.cb-lv__title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.cb-lv__badges { flex: 0 1 auto; min-width: 0; display: flex; gap: var(--space-1); overflow: hidden; }
.cb-lv__fill { flex: 1; }
.cb-lv__meta { flex: none; font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); font-feature-settings: "tnum" 1; white-space: nowrap; }
.cb-lv__trail { flex: none; display: inline-flex; align-items: center; gap: var(--space-2); }
.cb-lv__empty { margin: 0; padding: var(--space-8) var(--space-4); text-align: center; color: var(--muted-foreground); }
@container (max-width: 520px) { .cb-lv__badges, .cb-lv__prefix { display: none; } }

/* InlineEdit: text until it's pointed at, a quiet field when it is. */
.cb-inline {
  all: unset; box-sizing: border-box; display: block; width: 100%; resize: none; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere;
  margin: 0 calc(var(--space-2) * -1); width: calc(100% + var(--space-2) * 2); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm);
  font: inherit; font-size: var(--cb-fs); line-height: 1.55; color: var(--foreground); cursor: text; transition: background-color .12s ease, box-shadow .12s ease;
}
.cb-inline::placeholder { color: var(--muted-foreground); }
.cb-inline:hover { background: var(--cb-hover, var(--accent)); }
.cb-inline:focus { background: transparent; box-shadow: inset 0 0 0 1px var(--input); }
.cb-inline:focus-visible { box-shadow: var(--focus-ring); }
.cb-inline[readonly] { cursor: default; } .cb-inline[readonly]:hover { background: transparent; }
.cb-inline--title { font-size: calc(var(--cb-fs) * 1.7); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.cb-inline--heading { font-size: calc(var(--cb-fs) * 1.25); font-weight: 600; line-height: 1.3; }
[data-finish="desk"] .cb-inline { border-radius: var(--desk-radius-control); }

/* Properties: label and value side by side. */
.cb-props { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.cb-props__row { display: grid; grid-template-columns: minmax(84px, 34%) 1fr; align-items: center; gap: var(--space-2); min-height: var(--cb-h); }
.cb-props__label { color: var(--muted-foreground); font-size: calc(var(--cb-fs) * .93); }
.cb-props__value { margin: 0; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-1); }

/* Table as a data table: sortable headers, a checkbox column, a header that stays. */
.cb-table th.is-sortable { padding-top: 0; padding-bottom: 0; }
.cb-table__sort {
  all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-1); height: calc(var(--cb-h) * 1.05);
  margin: 0 calc(var(--space-1) * -1); padding: 0 var(--space-1); border-radius: var(--radius-sm); color: inherit; font: inherit;
}
.cb-table th.is-end .cb-table__sort { flex-direction: row-reverse; }
.cb-table__sort:hover, .cb-table__sort.is-active { color: var(--foreground); }
.cb-table__sort:focus-visible { box-shadow: var(--focus-ring); }
.cb-table__sort-icon { width: calc(var(--cb-icon) * .85); height: calc(var(--cb-icon) * .85); opacity: 0; transition: opacity .12s ease; }
.cb-table__sort:hover .cb-table__sort-icon, .cb-table__sort:focus-visible .cb-table__sort-icon { opacity: .5; }
.cb-table__sort.is-active .cb-table__sort-icon { opacity: 1; }
.cb-table .cb-table__pick { width: 1%; padding-right: 0; }
.cb-table .cb-table__pick .cb-check { align-items: center; }
.cb-table .cb-table__pick .cb-check__box { margin-top: 0; }
.cb-table--select tr.is-selected td, .cb-table--select.is-overflow tr.is-selected td:first-child { background-color: var(--cb-picked); }
.cb-table--select tr.is-selected td:first-child { box-shadow: none; }
.cb-table--sticky .cb-table__scroll { overflow: auto; }
.cb-table--sticky thead th { position: sticky; top: 0; z-index: 2; background: var(--card); box-shadow: inset 0 -1px 0 var(--border); }
.cb-table--sticky.cb-table--plain thead th { background: var(--cb-table-surface, var(--background)); }
.cb-table--sticky tbody tr:first-child td { border-top: 0; }

/* ----------------------------------------------------------- Desk finish */
/* Opt in with data-finish="desk" on the window's root (Shell and Window take finish="desk"). The working variant for
   web and desktop apps: tools used all day under a mouse, Tauri windows, menu bar panels. Same tokens and components,
   quieter: compact unless a density is set, flat, controls are rounded rectangles (desk-radius-control) and panels
   softer ones (desk-radius-panel), edges are hairlines (desk-edge) instead of drops, menus, dialogs and sheets are
   solid with shadow-desk-float, nothing blurs and nothing glows, and a press doesn't shrink. Light is its home theme.
   Switches, badges, avatars and the slider thumb stay round: they're round things, not pressable panels. */
[data-finish="desk"]:not([data-density]) {
  --cb-h: var(--control-sm); --cb-fs: var(--text-compact); --cb-icon: var(--icon-sm);
  --cb-pad: var(--space-3); --cb-gap: var(--space-2); --cb-hmin: 0px; --cb-type-fs: var(--text-default); font-size: var(--cb-fs);
}
.cb-desk-ground, [data-finish="desk"].cb-shell, [data-finish="desk"] .cb-shell, [data-finish="desk"].cb-window { background: var(--desk-ground); }
.cb-desk-chrome { background: var(--desk-chrome); }
[data-finish="desk"] .cb-btn, [data-finish="desk"] .cb-stepper__btn, [data-finish="desk"] .cb-input, [data-finish="desk"] .cb-seg,
[data-finish="desk"] .cb-tooltip, .cb-tooltip[data-finish="desk"] { border-radius: var(--desk-radius-control); }
[data-finish="desk"] .cb-btn { font-weight: 500; }
[data-finish="desk"] .cb-btn:active:not(:disabled), [data-finish="desk"] .cb-stepper__btn:active:not(:disabled),
[data-finish="desk"] .cb-tile:active { transform: none; }
[data-finish="desk"] .cb-btn--secondary, [data-finish="desk"] .cb-stepper__btn { background: var(--desk-control); color: var(--foreground); box-shadow: var(--shadow-desk-control); }
[data-finish="desk"] .cb-btn--secondary:hover:not(:disabled), [data-finish="desk"] .cb-stepper__btn:hover:not(:disabled) { background: color-mix(in srgb, var(--desk-control) 94%, var(--foreground)); }
[data-finish="desk"] .cb-btn--default:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 92%, var(--foreground)); }
[data-finish="desk"] .cb-input { background: var(--card); }
[data-finish="desk"] .cb-seg { padding: 2px; gap: 0; background: var(--muted); box-shadow: inset 0 0 0 1px var(--desk-edge); }
[data-finish="desk"] .cb-seg__item { height: calc(var(--cb-h) - 4px); border-radius: calc(var(--desk-radius-control) - 2px); font-weight: 500; }
[data-finish="desk"] .cb-seg__item.is-active { background: var(--desk-control); box-shadow: var(--shadow-desk-control); font-weight: 500; }
/* Panels: a hairline instead of a drop, a softer corner. */
[data-finish="desk"] .cb-card:not(.cb-card--float), [data-finish="desk"] .cb-list:not(.cb-list--plain) .cb-list__rows,
[data-finish="desk"] .cb-table:not(.cb-table--plain) { border-radius: var(--desk-radius-panel); box-shadow: var(--shadow-desk); }
[data-finish="desk"] .cb-card--float { border-radius: var(--desk-radius-panel); box-shadow: var(--shadow-desk-float); }
[data-finish="desk"] .cb-notice, [data-finish="desk"] .cb-tile, [data-finish="desk"] .cb-toast, [data-finish="desk"] .cb-dock,
[data-finish="desk"] .cb-scene, [data-finish="desk"] .cb-camera { border-radius: var(--desk-radius-panel); }
[data-finish="desk"] .cb-row__icon { border-radius: var(--desk-radius-control); }
[data-finish="desk"] .cb-tabs__tab.is-active::after { height: 2px; }
[data-finish="desk"] .cb-toolbar--sticky { background: var(--desk-ground); box-shadow: inset 0 -1px 0 var(--desk-edge); }
/* Menus, popovers, dialogs and sheets: solid, a hairline and a soft drop. A modal sheet comes down from the top of the
   window, as a Mac sheet does, instead of up from the bottom of a screen. */
.cb-menu[data-finish="desk"], .cb-popover[data-finish="desk"], [data-finish="desk"] .cb-menu, [data-finish="desk"] .cb-popover {
  border-radius: var(--desk-radius-panel); background: var(--popover); box-shadow: var(--shadow-desk-float);
}
.cb-menu[data-finish="desk"] .cb-menu__item, [data-finish="desk"] .cb-menu__item { border-radius: calc(var(--desk-radius-control) - 2px); min-height: calc(var(--cb-h) * .85); }
[data-finish="desk"] .cb-glass, [data-finish="desk"] .cb-card--glass {
  background: var(--popover); box-shadow: var(--shadow-desk-float); -webkit-backdrop-filter: none; backdrop-filter: none;
}
[data-finish="desk"] .cb-dialog { border-radius: var(--desk-radius-panel); }
[data-finish="desk"] .cb-scrim { -webkit-backdrop-filter: none; backdrop-filter: none; }
[data-finish="desk"] .cb-scrim--sheet { justify-content: flex-start; padding: 0 var(--space-3) var(--space-8); }
[data-finish="desk"] .cb-sheet { border-radius: var(--desk-radius-panel) var(--desk-radius-panel) 0 0; }
[data-finish="desk"] .cb-sheet-wrap .cb-sheet { border-radius: 0 0 var(--desk-radius-panel) var(--desk-radius-panel); padding-top: var(--cb-pad); }
[data-finish="desk"] .cb-sheet__grabber { display: none; }
[data-finish="desk"] .cb-sheet__title { font-size: calc(var(--cb-fs) * 1.3); line-height: 1.3; }
[data-finish="desk"] .cb-glass .cb-btn--secondary, [data-finish="desk"] .cb-glass .cb-stepper__btn,
[data-finish="desk"] .cb-glass .cb-seg { background: var(--desk-control); }
[data-finish="desk"] .cb-glass .cb-seg { background: var(--muted); }
/* What the finish must not take away: focus and disabled. */
[data-finish="desk"] .cb-btn:focus-visible, [data-finish="desk"] .cb-stepper__btn:focus-visible,
[data-finish="desk"] .cb-seg__item:focus-visible { box-shadow: var(--focus-ring); }
[data-finish="desk"] .cb-btn:disabled { background: var(--muted); color: var(--muted-foreground); box-shadow: none; }

/* Apps under Desk, Linear's way: the window is desk-frame, the sidebar sits on it, the content is an inset panel of
   desk-ground with a hairline and a soft corner. Rows and items are rounded rectangles with quiet fills. */
.cb-app[data-finish="desk"], [data-finish="desk"] .cb-app { background: var(--desk-frame); --cb-avatar-ring: var(--desk-frame); }
[data-finish="desk"] .cb-app__main { background: var(--desk-ground); --cb-avatar-ring: var(--desk-ground); margin: var(--space-2) var(--space-2) var(--space-2) 0; border-radius: var(--desk-radius-panel); box-shadow: var(--shadow-desk); overflow: hidden; }
.cb-app[data-finish="desk"]:not(.has-sidebar) .cb-app__main, [data-finish="desk"] .cb-app:not(.has-sidebar) .cb-app__main { margin-left: var(--space-2); }
[data-finish="desk"] .cb-app.is-narrow .cb-app__main { margin: 0; border-radius: 0; box-shadow: none; }
[data-finish="desk"] .cb-app__bar { box-shadow: inset 0 -1px 0 var(--desk-edge); }
[data-finish="desk"] .cb-app__drawer { background: var(--desk-frame); box-shadow: var(--shadow-desk-float); }
[data-finish="desk"] .cb-app .cb-app__body .cb-panes__sep { background-color: var(--desk-edge); }
[data-finish="desk"] .cb-side__row, [data-finish="desk"] .cb-side__item, [data-finish="desk"] .cb-tree__item, [data-finish="desk"] .cb-option,
[data-finish="desk"] .cb-side__twist, [data-finish="desk"] .cb-pages__page, .cb-picker[data-finish="desk"] .cb-option { border-radius: var(--desk-radius-control); }
[data-finish="desk"] .cb-cal__day { border-radius: var(--desk-radius-control); }
[data-finish="desk"] .cb-datefield, [data-finish="desk"] .cb-combo { border-radius: var(--desk-radius-control); background: var(--card); }
[data-finish="desk"] .cb-combo__chip { border-radius: calc(var(--desk-radius-control) - 2px); }
[data-finish="desk"] .cb-lv__head { background: var(--desk-chrome); box-shadow: inset 0 -1px 0 var(--desk-edge); }
[data-finish="desk"] .cb-lv__row { box-shadow: inset 0 -1px 0 var(--desk-edge); }
[data-finish="desk"] .cb-lv:focus .cb-lv__row.is-active { box-shadow: inset 2px 0 0 var(--ring), inset 0 -1px 0 var(--desk-edge); }
[data-finish="desk"] .cb-pages__page.is-current { background: var(--desk-control); box-shadow: var(--shadow-desk-control); }
[data-finish="desk"] .cb-skeleton { border-radius: calc(var(--desk-radius-control) - 2px); background: var(--desk-active); }
[data-finish="desk"] .cb-avatar { --cb-avatar-ring: var(--desk-ground); }
[data-finish="desk"] .cb-table--sticky thead th { background: var(--card); box-shadow: inset 0 -1px 0 var(--desk-edge); }
[data-finish="desk"] .cb-picker__search { box-shadow: inset 0 -1px 0 var(--desk-edge); }

/* Zone glow: the heart-rate zone as light rising from under the readouts. Put it first inside a
   positioned container, set data-zone="1"…"5" on it or any ancestor, and keep the zone number on screen
   too (colour is never the only signal). Dark only reads as light; in light it's a faint wash. */
[data-zone="1"] { --cb-zone: var(--zone-1); } [data-zone="2"] { --cb-zone: var(--zone-2); }
[data-zone="3"] { --cb-zone: var(--zone-3); } [data-zone="4"] { --cb-zone: var(--zone-4); }
[data-zone="5"] { --cb-zone: var(--zone-5); }
.cb-zone-glow {
  position: absolute; left: -10%; right: -10%; bottom: -120px; height: 380px; pointer-events: none; z-index: 0;
  background: radial-gradient(50% 50% at 50% 50%, var(--cb-zone, var(--zone-1)) 0%, transparent 70%);
  opacity: .32; transition: opacity .3s ease;
}
[data-theme="light"] .cb-zone-glow { opacity: .14; }

/* Preview helpers (used by the component cards) */
/* ------------------------------------------------------------------ Home */
/* Swatches: a light's colours as a row of discs; the chosen one ringed. */
.cb-swatches { display: flex; flex-wrap: wrap; gap: var(--space-3); }
.cb-swatch {
  all: unset; box-sizing: border-box; cursor: pointer; width: var(--cb-h); height: var(--cb-h); min-width: var(--hit-min); min-height: var(--hit-min);
  border-radius: var(--radius-full); background: var(--cb-swatch); box-shadow: inset 0 0 0 1px var(--border); transition: transform .1s ease;
}
.cb-swatch:active { transform: scale(.94); }
.cb-swatch.is-selected { box-shadow: inset 0 0 0 1px var(--border), 0 0 0 2px var(--background), 0 0 0 4px var(--foreground); }
.cb-swatch:focus-visible { box-shadow: var(--focus-ring); }

/* Thermostat: a card (readout, target, mode) or a dial for a wall. */
.cb-thermo__status { color: var(--muted-foreground); font-weight: 500; }
.cb-thermo__status:not(.cb-tone--neutral) { color: var(--cb-tone); }
.cb-thermo__body { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
.cb-thermo__targets { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.cb-thermo--dial { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
.cb-thermo__dial { position: relative; }
.cb-thermo__ring { position: absolute; top: 0; left: 0; overflow: visible; }
.cb-thermo__track { fill: none; stroke: var(--muted); stroke-linecap: round; }
.cb-thermo__arc { fill: none; stroke: var(--muted-foreground); stroke-linecap: round; transition: d .3s ease; }
.cb-thermo__arc:not(.cb-tone--neutral) { stroke: var(--cb-tone); }
.cb-thermo__now { fill: var(--foreground); stroke: var(--background); stroke-width: 3; }
.cb-thermo__center { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); text-align: center; }
.cb-thermo__name { font-size: calc(var(--cb-fs) * .87); font-weight: 500; color: var(--muted-foreground); }
.cb-thermo__big { font-size: calc(var(--cb-dial, 260px) * .26); font-weight: 300; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; display: inline-flex; }
.cb-thermo__deg { font-size: .4em; margin-top: .12em; margin-left: .04em; font-weight: 400; color: var(--muted-foreground); }
.cb-thermo__inside { font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); }
.cb-thermo__nudge { display: flex; gap: var(--space-6); }
.cb-thermo__nudge .cb-stepper__btn { width: calc(var(--cb-h) * 1.3); height: calc(var(--cb-h) * 1.3); }

/* Keypad: an alarm code. Keys at glance size; the code as dots. */
.cb-keypad { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
.cb-keypad__dots { display: flex; gap: var(--space-3); min-height: 16px; }
.cb-keypad__dot { width: 14px; height: 14px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 1.5px var(--input); transition: background-color .12s ease; }
.cb-keypad__dot.is-on { background: var(--foreground); box-shadow: none; }
.cb-keypad.is-invalid .cb-keypad__dot { box-shadow: inset 0 0 0 1.5px var(--destructive); }
.cb-keypad__error { margin: 0; color: var(--destructive); font-weight: 500; }
.cb-keypad__keys { display: grid; grid-template-columns: repeat(3, calc(var(--cb-h) * 1.6)); gap: var(--space-3); }
.cb-keypad__key {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center;
  width: calc(var(--cb-h) * 1.6); height: calc(var(--cb-h) * 1.6); border-radius: var(--radius-full);
  background: var(--secondary); color: var(--secondary-foreground); font-size: calc(var(--cb-fs) * 1.6); font-weight: 400; font-variant-numeric: tabular-nums;
  transition: background-color .16s ease, transform .1s ease; -webkit-tap-highlight-color: transparent;
}
.cb-keypad__key--word { background: transparent; font-size: var(--cb-fs); font-weight: 500; color: var(--muted-foreground); }
.cb-keypad__key:hover:not(:disabled) { background: color-mix(in srgb, var(--secondary) 86%, var(--foreground)); }
.cb-keypad__key--word:hover:not(:disabled) { background: var(--accent); color: var(--foreground); }
.cb-keypad__key:active:not(:disabled) { transform: scale(.95); }
.cb-keypad__key:focus-visible { box-shadow: var(--focus-ring); }
.cb-keypad__key:disabled { cursor: not-allowed; opacity: .5; }
.cb-keypad > .cb-btn { width: calc(var(--cb-h) * 4.8 + var(--space-3) * 2); }

/* CameraView: a frame of video or a still, with its name, Live or its age, and motion. */
.cb-camera {
  all: unset; box-sizing: border-box; position: relative; display: block; width: 100%; overflow: hidden;
  border-radius: var(--radius-lg); background: var(--scene); color: var(--foreground);
}
button.cb-camera { cursor: pointer; }
button.cb-camera:focus-visible { box-shadow: var(--focus-ring); }
.cb-camera__frame { display: block; position: relative; width: 100%; padding-top: calc(var(--cb-camera-ratio, .5625) * 100%); }
.cb-camera__frame > img, .cb-camera__frame > video, .cb-camera__frame > iframe, .cb-camera__frame > canvas {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border: 0; display: block;
}
.cb-camera__empty { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); color: var(--muted-foreground); font-weight: 500; }
.cb-camera__top, .cb-camera__foot { position: absolute; left: var(--space-3); right: var(--space-3); display: flex; justify-content: space-between; gap: var(--space-2); pointer-events: none; }
.cb-camera__top { top: var(--space-3); }
.cb-camera__foot { bottom: var(--space-3); }
.cb-camera__chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--radius-full);
  background: var(--popover); color: var(--popover-foreground); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-float);
}
.cb-camera__dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--destructive); }
.cb-camera__motion .cb-icon { color: var(--info); }

/* Timeline: what happened, by day, newest first. */
.cb-timeline { display: flex; flex-direction: column; gap: var(--space-4); }
.cb-timeline .cb-row__value { color: var(--muted-foreground); font-weight: 500; font-variant-numeric: tabular-nums; }
.cb-timeline__empty { margin: 0; color: var(--muted-foreground); }
.cb-timeline .cb-row__title { white-space: normal; }

.cb-demo { padding: var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.cb-demo--col { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
.cb-demo--grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); align-items: stretch; }

/* ------------------------------------------------------------------ Rail */
/* A titled row that scrolls sideways. The track keeps room around its items for a focused one's lift and ring,
   and gives that room back with a negative margin so the row still lines up with its title. */
.cb-rail { --cb-rail-room: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.cb-rail__head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); }
.cb-rail__title { margin: 0; font-size: calc(var(--cb-fs) * 1.2); line-height: 1.3; font-weight: 600; }
.cb-rail__desc { margin: var(--space-1) 0 0; color: var(--muted-foreground); font-size: calc(var(--cb-fs) * .9); }
.cb-rail__track {
  display: flex; gap: var(--cb-gap); overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;

}
const sumLine = b => { const s = summary(b); return Math.round(s.T/60) + ' min · up to ' + s.top.toFixed(1) + ' mph' + (s.inc > 0 ? ' at ' + num1(s.inc) + '%' : ''); };
const sumShort = b => { const s = summary(b); return Math.round(s.T/60) + ' min · ' + s.top.toFixed(1) + ' mph' + (s.inc > 0 ? ' · ' + num1(s.inc) + '%' : ''); };
// The same shape as the console's workout card: height by effort, warm-ups and cool-downs quiet, the hardest bright.
function bars(blocks, attrs){
  const f = flatten(blocks);
  if(!f.length) return '';
  const effort = s => s.mph + Math.max(0, s.inc)*0.25;
  const max = Math.max(...f.map(effort)), min = Math.min(...f.map(effort)), T = f.reduce((a, s) => a + s.d, 0);
  const gap = f.length > 40 ? '--profile-gap:1px;' : '';
  return `<div class="profile ${attrs || ''}" aria-hidden="true" style="${gap}">` + f.map(s => {
    const e = effort(s), h = max === min ? 76 : 26 + (e - min)/(max - min)*74;
    const cls = s.ph === 'warm' || s.ph === 'cool' ? 'easy' : e >= max - (max - min)*0.25 ? 'hot' : '';
    return `<i class="${cls}" style="flex:${(s.d/T*100).toFixed(2)} 1 0;height:${h.toFixed(0)}%"></i>`;
  }).join('') + '</div>';
}

/* ---------- the treadmill ---------- */
const A = {
  code:'', state:null, online:true, why:'', view:'loading', draft:null, dirty:false, isNew:false, busy:false, pairError:'', lastSig:'', runSig:'',
};
const BAD_CODE = 'That code didn’t match. Check it on the treadmill: Settings, then Phone.';
const HOLD_MS = 1500;
const RUN_STATES = ['countdown', 'running', 'paused', 'done'];
const runNow = () => (A.state && A.state.control && A.state.run) || null;
const inRun = () => { const r = runNow(); return !!r && RUN_STATES.includes(r.st); };
const limits = () => (A.state && A.state.limits) || { mphMin:0.5, mphMax:12, incMin:-3, incMax:12 };
const normCode = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');

async function api(method, path, body){
  // Mid-run, knowing the treadmill's gone matters more than waiting out a slow network.
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), A.view === 'run' ? 3500 : 7000);
  try{
    const r = await fetch('api/' + path, { method, cache:'no-store', signal:ctl.signal,
      headers:Object.assign({ 'X-Deck-Code':A.code }, body ? { 'Content-Type':'application/json' } : {}), body:body ? JSON.stringify(body) : undefined });
    let j = {}; try{ j = await r.json(); }catch(_){}
    return { status:r.status, j };
  } finally { clearTimeout(to); }
}
function took(j){ A.state = j; A.online = true; }

async function refresh(){
  if(!A.code) return showPair('');
  let res;
  try{ res = await api('GET', 'state'); }
  catch(_){ if(A.online){ A.online = false; paint(); } else if(A.view === 'loading'){ goHome(); } return; }
  if(res.status === 401) return showPair(BAD_CODE);
  if(res.status === 429) return;
  if(res.status !== 200){ A.online = false; paint(); return; }
  const wasOffline = !A.online;
  took(res.j);
  store.set('phone.code', A.code);
  if(location.hash.slice(1) !== A.code) history.replaceState(history.state, '', '#' + A.code);   // so Add to Home Screen keeps it
  if(A.view === 'loading' || A.view === 'pair'){
    const draft = (() => { try{ return JSON.parse(store.get('phone.draft') || 'null'); }catch(_){ return null; } })();
    if(draft && draft.blocks && draft.blocks.length) return openDraft(draft, true);
    return goHome();
  }
  route();
}

/* ---------- screens ---------- */
function paint(){ if(A.view === 'pair') paintPair(); else route(); }
/* Which screen: a run under way takes over from Home, and goes back when it ends. A workout being edited is never pulled away. */
function route(){
  if(A.view === 'pair' || A.view === 'loading') return;
  if(A.view === 'edit') return paintEditNotice();
  if(inRun()){
    if(A.view !== 'run'){ if($('sheet').firstChild) closeSheet(); A.view = 'run'; A.runSig = ''; }
    return paintRun();
  }
  if(A.view === 'run'){
    A.runSig = '';
    if(A.draft){ A.view = 'edit'; return paintEdit(); }
    A.view = 'home'; A.lastSig = '';
  }
  paintHome();
}
function goHome(){ A.view = 'home'; A.lastSig = ''; route(); }

/* ---------- the run: only with Control from phone on, which only the treadmill can allow ---------- */
function runHtml(r){

  if(r.st === 'countdown') return `<main class="counting">

  const nums = `<div class="run-nums">

    <section class="cb-card run-num" aria-label="Distance"><span class="cb-t-readout-md tnum" id="rMiles"></span><span class="muted small">Miles</span></section>

    <div class="bar"><div class="bar__in"><button class="cb-btn cb-btn--default cb-btn--size-lg" type="button" data-act="run-done">Done</button></div></div>`;
  const nudgeHtml = (key, label, unit) => `<section class="cb-card"><div class="cb-stepper wide" role="group" aria-label="${label}">
      <button type="button" class="cb-stepper__btn" data-nudge="${key}" data-dir="-1" aria-label="Less ${label.toLowerCase()}">${icon('chevron-left')}</button>
      <div class="cb-stepper__val" aria-live="polite"><span class="cb-stepper__reading"><span class="cb-stepper__num tnum" id="rv_${key}"></span><span class="cb-stepper__unit${unit === '%' ? ' is-tight' : ''}">${unit}</span></span><span class="cb-stepper__label">${label}</span></div>
      <button type="button" class="cb-stepper__btn" data-nudge="${key}" data-dir="1" aria-label="More ${label.toLowerCase()}">${icon('chevron-right')}</button>
    </div></section>`;
  const paused = r.st === 'paused';
  return `<main class="cb-page view" style="--cb-page-w:560px">${head}<div class="flow">
      <div id="runNotice"></div>
      ${paused ? `<section class="cb-card step-now"><p class="eyebrow">Paused</p><p class="muted" style="margin:0">Belt stopped. Resuming counts down on the treadmill first.</p></section>`
        : r.step ? `<section class="cb-card step-now" aria-label="This step">
          <div class="step-now__line"><span class="step-now__name" id="rStep"></span><span class="cb-t-readout-md tnum" id="rLeft"></span></div>
          <div class="cb-progress__track"><div class="cb-progress__bar cb-tone--info" id="rShare" style="width:0"></div></div>
          <span class="muted small tnum" id="rNext"></span>
        </section>` : ''}

      ${paused
        ? `<button class="cb-btn cb-btn--default cb-btn--size-lg cb-btn--hold" style="--cb-hold:${HOLD_MS}ms" type="button" data-hold="resume" id="rResume">Hold to resume</button>`
        : `<button class="cb-btn cb-btn--default cb-btn--size-lg" type="button" data-act="run-pause">Pause</button>`}

}
function paintRun(){
  const r = runNow(); if(!r) return;
  const sig = [r.st, !!r.step, A.online].join();
  if(A.runSig !== sig){ A.runSig = sig; $('app').innerHTML = runHtml(r); scrollTo(0, 0); }
  fillRun(r);
}
function fillRun(r){
  const put = (id, t) => { const e = $(id); if(e && e.textContent !== t) e.textContent = t; };
  put('rCount', String(r.count || '')); put('rLine', (r.line || '').replace('Started from your phone. ', '').replace(' from your phone', ''));   // those words are for whoever's at the treadmill
  put('rTime', fmtTime(r.secs || 0)); put('rMiles', (r.miles || 0).toFixed(2));
  if(r.step){
    put('rStep', r.step.label); put('rLeft', fmtTime(r.step.left));
    const n = r.step.next;
    put('rNext', n ? 'Next: ' + n.label + ' · ' + n.mph.toFixed(1) + ' mph' + (n.inc ? ' at ' + num1(n.inc) + '%' : '') : 'Last step');
    const bar = $('rShare'); if(bar) bar.style.width = Math.min(100, r.step.share*100).toFixed(1) + '%';
  }
  const L = limits(), mph = clamp((r.mph || 0) + NUDGE.speed.wait + NUDGE.speed.sent, L.mphMin, L.mphMax), inc = clamp((r.inc || 0) + NUDGE.inc.wait + NUDGE.inc.sent, L.incMin, L.incMax);
  put('rv_speed', mph.toFixed(1)); put('rv_inc', num1(inc));
  const live = r.st === 'running' && A.online && !r.stale;
  document.querySelectorAll('[data-nudge]').forEach(b => {
    const v = b.dataset.nudge === 'speed' ? mph : inc, lo = b.dataset.nudge === 'speed' ? L.mphMin : L.incMin, hi = b.dataset.nudge === 'speed' ? L.mphMax : L.incMax;
    b.disabled = !live || (+b.dataset.dir < 0 ? v <= lo : v >= hi);
  });
  const res = $('rResume'); if(res) res.disabled = !(r.ready && A.online && !r.stale);
  const note = $('runNotice'); if(!note) return;
  // Losing the phone doesn't stop the belt, so it says so as plainly as it can.
  const html = !A.online
    ? `<div role="alert" class="cb-notice cb-tone--destructive">${icon('wifi-off', 'cb-notice__icon')}<div class="cb-notice__text"><p class="cb-notice__title">Can’t reach the treadmill</p><div class="cb-notice__body">The belt may still be moving. Use the treadmill’s own controls, or pull the safety key.</div></div></div>`
    : r.stale ? `<div role="alert" class="cb-notice cb-tone--warning">${icon('triangle-alert', 'cb-notice__icon')}<div class="cb-notice__text"><p class="cb-notice__title">The treadmill’s screen isn’t answering</p><div class="cb-notice__body">Pause and End still work. For anything else, use the treadmill’s own controls.</div></div></div>`
    : r.st === 'paused' && !r.ready ? `<div role="status" class="cb-notice cb-tone--warning">${icon('triangle-alert', 'cb-notice__icon')}<div class="cb-notice__text"><p class="cb-notice__title">${esc(r.why)}</p></div></div>`
    : '';
  if(note.__h !== html){ note.__h = html; note.innerHTML = html; }
}
async function runCmd(body){
  try{
    const res = await api('POST', 'run', body);
    if(res.status === 401){ showPair(BAD_CODE); return false; }
    if(res.status === 200){ took(res.j); if(res.j.note) hint(res.j.note); route(); return true; }
    hint(res.j.why || 'The treadmill couldn’t do that.');
    refresh();   // a refused start uses up its token, so get the new one
    return false;
  } catch(_){ A.online = false; paint(); return false; }

/* Speed and incline go one at a time: taps that land during a request join the next one, so a slow network can't queue up a surprise. */
const NUDGE = { speed:{ step:0.1, cmd:'speed', wait:0, sent:0 }, inc:{ step:0.5, cmd:'incline', wait:0, sent:0 } };
let nudging = false;
function nudge(key, dir){
  const n = NUDGE[key];
  n.wait = Math.round((n.wait + dir*n.step)*10)/10;
  const r = runNow(); if(r) fillRun(r);
  flushNudges();
}
async function flushNudges(){
  if(nudging) return;
  const n = NUDGE.speed.wait ? NUDGE.speed : NUDGE.inc.wait ? NUDGE.inc : null;
  const r = runNow();
  if(!n) return;
  if(!r){ n.wait = 0; return; }
  nudging = true;
  const d = n.wait; n.sent = d; n.wait = 0;
  const ok = await runCmd({ cmd:n.cmd, d, run:r.id });
  n.sent = 0;
  if(!ok){ NUDGE.speed.wait = 0; NUDGE.inc.wait = 0; }
  nudging = false;
  const now = runNow(); if(now && A.view === 'run') fillRun(now);
  flushNudges();
}

  $('shape').innerHTML = bars(A.draft.blocks);
  $('warn').innerHTML = s.first && s.first.mph > 5
    ? `<p class="warn">${icon('triangle-alert', '', 16)}<span>This starts at ${s.first.mph.toFixed(1)} mph with no warm-up.</span></p>` : '';
  $('warn').hidden = !$('warn').innerHTML;
}
const stepRow = (s, b, k) => `<button class="step" type="button" data-act="edit-step" data-b="${b}"${k == null ? '' : ` data-s="${k}"`} aria-label="${esc(kind(s.ph).label)}, ${fmtTime(s.d)}, ${s.mph.toFixed(1)} miles an hour, ${num1(s.inc)} percent incline">
    <span class="step__name">${esc(kind(s.ph).label)}</span><span class="step__num">${fmtTime(s.d)}</span><span class="step__num">${s.mph.toFixed(1)} <small>mph</small></span><span class="step__num">${num1(s.inc)}<small>%</small></span>${icon('chevron-right', '', 16)}
  </button>`;
function paintSteps(){
  $('steps').innerHTML = A.draft.blocks.map((b, i) => b.kind === 'repeat'
    ? `<div class="rep"><button class="rep__head" type="button" data-act="edit-repeat" data-b="${i}">${icon('repeat', '', 18)}<span>Repeat ${b.times} times</span><span class="muted tnum small">${fmtTime(b.times*b.steps.reduce((a, s) => a + s.d, 0))}</span>${icon('chevron-right', '', 16)}</button>
        ${b.steps.map((s, k) => stepRow(s, i, k)).join('')}
        <div class="rep__foot"><button class="cb-btn cb-btn--ghost cb-btn--size-sm" type="button" data-act="add-inner" data-b="${i}"${b.steps.length >= MAX_INNER ? ' disabled' : ''}>${icon('plus', '', 16)}Add a step to repeat</button></div></div>`
    : stepRow(b, i, null)).join('');
}

/* ---------- sheets ---------- */
let sheetClose = null, sheetBack = null;
function openSheet(title, body, foot, onClose){
  sheetBack = document.activeElement;
  sheetClose = onClose || null;
  $('sheet').innerHTML = `<div class="cb-scrim cb-scrim--sheet cb-scrim--fixed"><div class="cb-sheet-wrap" style="--cb-sheet-w:560px">
    <div role="dialog" aria-modal="true" aria-labelledby="sheetTitle" class="cb-sheet solid" tabindex="-1" id="sheetBox">
      <div class="cb-sheet__grabber" aria-hidden="true"></div>
      <header class="cb-sheet__head"><div><h2 class="cb-sheet__title" id="sheetTitle">${esc(title)}</h2></div>
        <button class="cb-btn cb-btn--secondary cb-btn--size-icon" type="button" data-act="close-sheet" aria-label="Close">${icon('x')}</button></header>
      <div class="cb-sheet__body">${body}</div>
      ${foot ? `<footer class="cb-sheet__foot">${foot}</footer>` : ''}
    </div></div></div>`;
  $('sheetBox').focus({ preventScroll:true });
}
function closeSheet(){
  const fn = sheetClose; sheetClose = null;
  $('sheet').innerHTML = '';
  stepCtx = null;
  if(fn) fn();
  if(sheetBack && document.contains(sheetBack)) sheetBack.focus({ preventScroll:true });
  sheetBack = null;
}
addEventListener('keydown', e => {
  if(!$('sheet').firstChild) return;
  if(e.key === 'Escape') return closeSheet();
  if(e.key !== 'Tab') return;
  const f = [...$('sheet').querySelectorAll('button:not(:disabled), select, input')];
  if(!f.length) return;
  const a = f[0], z = f[f.length - 1];
  if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
  else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
});

/* A stepper's value updates in place, so the button under a held finger is never replaced. */
let stepCtx = null;   // { get, title } while a step or repeat sheet is open
const STEPPERS = {
  d:{ label:'Time', step:15, min:15, max:7200, show:v => [fmtTime(v), ''] },
  mph:{ label:'Speed', step:0.1, min:() => limits().mphMin, max:() => limits().mphMax, show:v => [v.toFixed(1), 'mph'] },
  inc:{ label:'Incline', step:0.5, min:() => limits().incMin, max:() => limits().incMax, show:v => [num1(v), '%'] },
  times:{ label:'Times', step:1, min:MIN_TIMES, max:MAX_TIMES, show:v => [String(v), ''] },
};
const lim = v => typeof v === 'function' ? v() : v;
const stepperHtml = key => { const c = STEPPERS[key]; return `<div class="cb-stepper wide" role="group" aria-label="${c.label}">
    <button type="button" class="cb-stepper__btn" data-step="${key}" data-dir="-1" aria-label="Less ${c.label.toLowerCase()}">${icon('chevron-left')}</button>
    <div class="cb-stepper__val" aria-live="polite"><span class="cb-stepper__reading"><span class="cb-stepper__num tnum" id="val_${key}"></span><span class="cb-stepper__unit${key === 'inc' ? ' is-tight' : ''}" id="unit_${key}"></span></span><span class="cb-stepper__label">${c.label}</span></div>
    <button type="button" class="cb-stepper__btn" data-step="${key}" data-dir="1" aria-label="More ${c.label.toLowerCase()}">${icon('chevron-right')}</button>
  </div>`; };
function paintSteppers(){
  if(!stepCtx) return;
  const o = stepCtx.get();
  Object.keys(STEPPERS).forEach(key => {
    const el = $('val_' + key); if(!el) return;
    const c = STEPPERS[key], [v, u] = c.show(o[key]);
    el.textContent = v; $('unit_' + key).textContent = u;
    document.querySelectorAll(`[data-step="${key}"]`).forEach(b => { b.disabled = +b.dataset.dir < 0 ? o[key] <= lim(c.min) : o[key] >= lim(c.max); });
  });
}
function stepBy(key, dir, mult){
  const o = stepCtx && stepCtx.get(); if(!o) return;
  const c = STEPPERS[key];
  const v = clamp(Math.round((o[key] + dir*c.step*(mult || 1))/c.step)*c.step, lim(c.min), lim(c.max));
  o[key] = c.step < 1 ? Math.round(v*10)/10 : v;
  delete o.fresh;
  paintSteppers(); touched();
}
let hold = null, justHeld = false;
function endHold(){ if(hold){ clearTimeout(hold.t); if(hold.n) justHeld = true; hold = null; } }
addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-step],[data-nudge]'); if(!b || b.disabled) return;
  justHeld = false;
  const key = b.dataset.step, dir = +b.dataset.dir;
  const run = () => {
    if(!hold) return;
    if(b.disabled){ endHold(); return; }
    hold.n++;
    // The run's speed and incline repeat at the pace of the console's own buttons.
    if(b.dataset.nudge){ nudge(b.dataset.nudge, dir); hold.t = setTimeout(run, 120); return; }
    stepBy(key, dir, key === 'd' ? (hold.n > 30 ? 4 : hold.n > 12 ? 2 : 1) : 1);
    hold.t = setTimeout(run, hold.n < 4 ? 170 : hold.n < 14 ? 90 : 50);
  };
  hold = { n:0, t:setTimeout(run, 400) };
});
addEventListener('pointerup', endHold); addEventListener('pointercancel', endHold);

const moveRow = (where, canUp, canDown, canDelete) => `<div class="row-btns">
    <button class="cb-btn cb-btn--secondary cb-btn--size-icon" type="button" data-act="move" data-dir="-1"${canUp ? '' : ' disabled'} aria-label="Move ${where} up">${icon('arrow-up')}</button>
    <button class="cb-btn cb-btn--secondary cb-btn--size-icon" type="button" data-act="move" data-dir="1"${canDown ? '' : ' disabled'} aria-label="Move ${where} down">${icon('arrow-down')}</button>
    <button class="cb-btn cb-btn--secondary" type="button" data-act="copy" aria-label="Copy ${where}">${icon('copy', '', 18)}Copy</button>
    <button class="cb-btn cb-btn--secondary" type="button" data-act="remove"${canDelete ? '' : ' disabled'} aria-label="Delete ${where}" style="color:var(--destructive)">${icon('trash-2', '', 18)}Delete</button>
  </div>`;
const doneBtn = () => `<button class="cb-btn cb-btn--default cb-btn--size-lg" style="flex:1" type="button" data-act="close-sheet">Done</button>`;

let target = null;   // { b, s } the block, and the step inside it if it's in a repeat
const container = () => target.s == null ? A.draft.blocks : A.draft.blocks[target.b].steps;
const index = () => target.s == null ? target.b : target.s;
const holdLimits = s => { s.mph = clamp(s.mph, limits().mphMin, limits().mphMax); s.inc = clamp(s.inc, limits().incMin, limits().incMax); return s; };

function openStep(b, s){
  target = { b, s:s == null ? null : s };
  const step = () => container()[index()];
  holdLimits(step());
  stepCtx = { get:step };
  const c = container(), i = index();
  const canDelete = s == null ? A.draft.blocks.length > 1 : c.length > 1;
  openSheet('Step', `
    <div class="cb-field"><label class="cb-field__label" for="stepKind">Type</label>
      <div class="cb-input cb-select"><select id="stepKind">${KINDS.map(k => `<option value="${k.ph}"${k.ph === step().ph ? ' selected' : ''}>${k.label}</option>`).join('')}</select>${icon('chevron-down', 'cb-select__chevron')}</div></div>
    ${stepperHtml('d')}${stepperHtml('mph')}${stepperHtml('inc')}
    ${moveRow('step', i > 0, i < c.length - 1, canDelete)}`, doneBtn());
  $('stepKind').addEventListener('change', e => {
    const st = step(), k = kind(e.target.value);
    st.ph = k.ph;
    // A step nobody has adjusted yet takes the new kind's usual numbers.
    if(st.fresh){ st.d = k.d; st.mph = k.mph; st.inc = k.inc; holdLimits(st); }
    paintSteppers(); touched();
  });
  paintSteppers();
}
function openRepeat(b){
  target = { b, s:null };
  const rep = () => A.draft.blocks[target.b];
  stepCtx = { get:rep };
  const i = target.b, canDelete = A.draft.blocks.length > 1;
  openSheet('Repeat', `${stepperHtml('times')}${moveRow('repeat', i > 0, i < A.draft.blocks.length - 1, canDelete)}`, doneBtn());
  paintSteppers();
}

/* ---------- saving ---------- */
const cleanBlocks = blocks => blocks.map(b => b.kind === 'repeat'
  ? { kind:'repeat', times:b.times, steps:b.steps.map(s => ({ ph:s.ph, d:s.d, mph:s.mph, inc:s.inc })) }
  : { ph:b.ph, d:b.d, mph:b.mph, inc:b.inc });

async function saveWorkout(next){
  const d = A.draft;
  if(A.busy) return false;
  if(!d.name.trim()){ A.why = 'Give this workout a name.'; paintEditNotice(); $('wName').focus(); scrollTo(0, 0); return false; }
  A.busy = true;
  try{
    const res = await api('POST', 'workouts', { id:d.id || '', name:d.name, blocks:cleanBlocks(d.blocks), next:!!next });
    if(res.status === 401){ showPair(BAD_CODE); return false; }
    if(res.status !== 200){ A.why = res.j.why || 'The treadmill couldn’t save that.'; paintEditNotice(); scrollTo(0, 0); return false; }
    took(res.j); A.why = ''; A.dirty = false; dropDraft();
    return true;
  } catch(_){
    A.online = false; A.why = ''; paintEditNotice(); scrollTo(0, 0);
    return false;
  } finally { A.busy = false; }
}
function backHome(){ A.draft = null; A.dirty = false; A.why = ''; dropDraft(); goHome(); }

function hint(words){
  const el = document.createElement('div');
  el.className = 'cb-toast cb-tone--warning';
  el.innerHTML = `${icon('info', 'cb-toast__icon')}<div class="cb-toast__text"><p class="cb-toast__title">${esc(words)}</p></div>`;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}
function toast(title, body){
  const el = document.createElement('div');
  el.className = 'cb-toast cb-tone--success';
  el.innerHTML = `${icon('circle-check', 'cb-toast__icon')}<div class="cb-toast__text"><p class="cb-toast__title">${esc(title)}</p>${body ? `<div class="muted small">${esc(body)}</div>` : ''}</div>`;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* ---------- what the buttons do ---------- */
const ACT = {
  retry(){ refresh(); },
  'run-pause'(){ const r = runNow(); if(r) runCmd({ cmd:'pause', run:r.id }); },
  'run-stop'(){ const r = runNow(); if(r) runCmd({ cmd:'stop', run:r.id }); },
  'run-cancel'(){ runCmd({ cmd:'cancel' }); },
  'run-done'(){ const r = runNow(); if(r) runCmd({ cmd:'done', run:r.id }); },
  'view-run'(){ A.view = 'run'; A.runSig = ''; route(); },
  new(){
    openSheet('New workout', `<div class="cb-list__rows">
      ${TEMPLATES.map((t, i) => `<div class="cb-list__item"><button class="saved__open" style="width:100%;padding-right:var(--space-3)" type="button" data-act="from-template" data-i="${i}">
        ${bars(t.blocks, 'profile--mini')}<span class="saved__text"><span class="saved__name">${esc(t.name)}</span><span class="saved__sum tnum">${esc(sumShort(t.blocks))}</span></span>${icon('chevron-right', '', 16)}</button></div>`).join('')}
      <div class="cb-list__item"><button class="saved__open" style="width:100%;padding-right:var(--space-3)" type="button" data-act="from-template" data-i="-1">
        <span class="saved__text"><span class="saved__name">Start from nothing</span><span class="saved__sum">One step, then add your own</span></span>${icon('chevron-right', '', 16)}</button></div>
    </div>`);
  },
  'from-template'(b){
    const i = +b.dataset.i, t = i >= 0 ? TEMPLATES[i] : { name:'', blocks:[Object.assign(stepOf('walk', 5, 3.0, 0), { fresh:true })] };
    const blocks = clone(t.blocks);
    flatten(blocks).forEach(holdLimits);
    closeSheet();
    openDraft({ name:t.name, blocks });
    if(i < 0) $('wName').focus();
  },
  open(b){ openWorkout(b.dataset.id); },
  async send(b){
    const w = (A.state.list || []).find(x => x.id === b.dataset.id); if(!w) return;
    try{
      const res = await api('POST', 'next', { id:w.id });
      if(res.status === 200){ took(res.j); A.lastSig = ''; route(); scrollTo({ top:0, behavior:'smooth' }); toast('Sent', w.name + ' is up next on the treadmill.'); }
      else if(res.status === 401) showPair(BAD_CODE);
      else { refresh(); }
    } catch(_){ A.online = false; paint(); }
  },
  async 'clear-next'(){
    try{ const res = await api('POST', 'next', { id:'' }); if(res.status === 200){ took(res.j); A.lastSig = ''; route(); } }
    catch(_){ A.online = false; paint(); }
  },
  back(){ history.back(); },
  discard(){ backHome(); },
  async save(){ if(await saveWorkout(false)){ const n = A.draft.name.trim(); backHome(); toast('Saved', n + ' is on the treadmill.'); } },
  async 'send-draft'(){ if(await saveWorkout(true)){ const n = A.draft.name.trim(); backHome(); toast('Sent', n + ' is up next on the treadmill.'); } },
  'add-step'(){
    const b = A.draft.blocks;
    if(b.length >= MAX_BLOCKS){ A.why = 'That’s as many steps as a workout can hold.'; paintEditNotice(); return; }
    const k = kind('run');
    b.push(holdLimits({ ph:k.ph, d:k.d, mph:k.mph, inc:k.inc, fresh:true }));
    touched(); openStep(b.length - 1, null);
  },
  'add-repeat'(){
    const b = A.draft.blocks;
    if(b.length >= MAX_BLOCKS){ A.why = 'That’s as many steps as a workout can hold.'; paintEditNotice(); return; }
    b.push({ kind:'repeat', times:4, steps:[holdLimits(stepOf('run', 1, 7.0, 1)), holdLimits(stepOf('rec', 2, 3.8, 1))] });
    touched(); openRepeat(b.length - 1);
  },
  'add-inner'(btn){
    const i = +btn.dataset.b, s = A.draft.blocks[i].steps; if(s.length >= MAX_INNER) return;
    const k = kind('run');
    s.push(holdLimits({ ph:k.ph, d:60, mph:k.mph, inc:k.inc, fresh:true }));
    touched(); openStep(i, s.length - 1);
  },
  'edit-step'(b){ openStep(+b.dataset.b, b.dataset.s == null ? null : +b.dataset.s); },
  'edit-repeat'(b){ openRepeat(+b.dataset.b); },
  move(b){
    const c = container(), i = index(), j = i + +b.dataset.dir;
    if(j < 0 || j >= c.length) return;
    const tmp = c[i]; c[i] = c[j]; c[j] = tmp;
    if(target.s == null) target.b = j; else target.s = j;
    touched();
    const isRep = c[j].kind === 'repeat';
    closeSheet();
    if(isRep) openRepeat(j); else openStep(target.b, target.s);
  },
  copy(){
    const c = container(), i = index();
    if(c.length >= (target.s == null ? MAX_BLOCKS : MAX_INNER)) return;
    c.splice(i + 1, 0, clone(c[i]));
    touched(); closeSheet();
  },
  remove(){
    const c = container(), i = index();
    if(c.length <= 1) return;
    c.splice(i, 1);
    touched(); closeSheet();
  },
  'close-sheet'(){ closeSheet(); },
  'delete-workout'(){
    const n = A.draft.name;
    openSheet('Delete this workout?', `<p class="muted" style="margin:0">${esc(n || 'This workout')} comes off the treadmill. Runs you’ve already done stay in History.</p>`,
      `<button class="cb-btn cb-btn--secondary cb-btn--size-lg" style="flex:1" type="button" data-act="close-sheet">Keep it</button>
       <button class="cb-btn cb-btn--destructive cb-btn--size-lg" style="flex:1" type="button" data-act="delete-yes">Delete</button>`);
  },
  async 'delete-yes'(){
    const d = A.draft; closeSheet();
    try{
      const res = await api('DELETE', 'workouts/' + encodeURIComponent(d.id));
      if(res.status === 200){ took(res.j); backHome(); toast('Deleted', d.name + ' is off the treadmill.'); }
      else { A.why = res.j.why || 'The treadmill couldn’t delete that.'; paintEditNotice(); }
    } catch(_){ A.online = false; paintEditNotice(); scrollTo(0, 0); }
  },
};
document.addEventListener('click', e => {
  if(e.target.classList && e.target.classList.contains('cb-scrim')) return closeSheet();
  const stepper = e.target.closest('[data-step],[data-nudge]');
  if(stepper){
    if(justHeld){ justHeld = false; return; }
    if(stepper.disabled) return;
    if(stepper.dataset.nudge) nudge(stepper.dataset.nudge, +stepper.dataset.dir);
    else stepBy(stepper.dataset.step, +stepper.dataset.dir);
    return;
  }
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if(fn) fn(b, e);
});

const HOLDS = {
  start(b){ runCmd({ cmd:'start', what:b.dataset.what, nonce:A.state.nonce }); },
  resume(){ const r = runNow(); if(r) runCmd({ cmd:'resume', run:r.id, nonce:A.state.nonce }); },
};
let holding = null;
function holdStart(b){
  holdEnd();
  b.classList.add('is-holding');
  holding = { b, t:setTimeout(() => {
    const el = holding && holding.b; holding = null;
    if(!el) return;
    el.classList.remove('is-holding');
    if(document.contains(el) && !el.disabled && HOLDS[el.dataset.hold]) HOLDS[el.dataset.hold](el);
  }, HOLD_MS) };
}
function holdEnd(early){
  if(!holding) return;
  clearTimeout(holding.t); holding.b.classList.remove('is-holding'); holding = null;
  if(early) hint('Keep holding until the button fills.');
}
addEventListener('pointerdown', e => { const b = e.target.closest('[data-hold]'); if(b && !b.disabled) holdStart(b); });
addEventListener('pointerup', () => holdEnd(true));
addEventListener('pointercancel', () => holdEnd());
addEventListener('pointerout', e => { if(holding && e.target === holding.b && !holding.b.contains(e.relatedTarget)) holdEnd(); });
addEventListener('contextmenu', e => { if(e.target.closest('[data-hold]')) e.preventDefault(); });
addEventListener('keydown', e => { if((e.key === ' ' || e.key === 'Enter') && !e.repeat && e.target.closest && e.target.closest('[data-hold]') && !e.target.disabled){ e.preventDefault(); holdStart(e.target.closest('[data-hold]')); } });
addEventListener('keyup', e => { if(e.key === ' ' || e.key === 'Enter') holdEnd(true); });

/* Back, in the page or with the phone's own gesture: a change is saved on the way out if it can be. */
addEventListener('popstate', async () => {
  if($('sheet').firstChild){ closeSheet(); if(A.view === 'edit') history.pushState({ v:'edit' }, ''); return; }
  if(A.view !== 'edit') return;
  if(!A.dirty) return backHome();
  const name = A.draft.name.trim();
  if(await saveWorkout(false)){ backHome(); toast('Saved', name + ' is on the treadmill.'); }
  else history.pushState({ v:'edit' }, '');   // couldn't save: stay here, with the reason showing
});

/* ---------- away ---------- */
A.code = normCode(location.hash.slice(1)) || normCode(store.get('phone.code'));
(async function loop(){
  if(document.visibilityState === 'visible' && A.view !== 'pair'){ try{ await refresh(); }catch(_){} }
  const r = runNow();
  setTimeout(loop, A.view === 'run' ? (r && r.st === 'countdown' ? 400 : 1000) : r ? 3000 : 5000);
})();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && A.view !== 'pair') refresh(); });
})();
</script>
</body>
</html>
