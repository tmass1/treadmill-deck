.cb-t-readout-md { font-family: var(--font-sans); font-size: 32px; line-height: 36px; font-weight: 400; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.cb-t-title { font-family: var(--font-sans); font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
.cb-t-heading { font-family: var(--font-sans); font-size: 18px; line-height: 24px; font-weight: 600; }
.cb-t-body { font-family: var(--font-sans); font-size: 15px; line-height: 22px; font-weight: 400; }
.cb-t-label { font-family: var(--font-sans); font-size: 13px; line-height: 16px; font-weight: 500; }
.cb-t-unit { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.cb-t-code { font-family: var(--font-mono); font-size: 13px; line-height: 20px; font-weight: 400; }


/* Cabin — component styles. Every value comes from tokens.css; this file only
   wires tokens to parts. Density: set data-density on any container. */

/* Unset is touch: Cabin is for screens people tap and read from a step back. --cb-hmin is the smallest target a
   control pads out to: hit-min where a finger is the pointer, nothing where it isn't (a mouse, a TV remote). */
:root, [data-density="touch"] {
  --cb-h: var(--control-lg); --cb-fs: var(--text-touch); --cb-icon: var(--icon-lg);
  --cb-pad: var(--space-5); --cb-gap: var(--space-3); --cb-hmin: var(--hit-min);
}
[data-density="regular"], [data-density="default"] {
  --cb-h: var(--control-md); --cb-fs: var(--text-default); --cb-icon: var(--icon-md);
  --cb-pad: var(--space-4); --cb-gap: var(--space-3); --cb-hmin: 0px;
}
[data-density="compact"] {
  --cb-h: var(--control-sm); --cb-fs: var(--text-compact); --cb-icon: var(--icon-sm);
  --cb-pad: var(--space-3); --cb-gap: var(--space-2); --cb-hmin: 0px;
}
[data-density="glance"] {
  --cb-h: var(--control-xl); --cb-fs: var(--text-glance); --cb-icon: var(--icon-xl);
  --cb-pad: var(--space-6); --cb-gap: var(--space-4); --cb-hmin: var(--hit-min);
}
/* TV: ten feet away, a remote in hand. Sizes follow the screen's height (see the tv tokens), focus is the pointer. */
[data-density="tv"] {
  --cb-h: var(--control-tv); --cb-fs: var(--text-tv); --cb-icon: var(--icon-tv);
  --cb-pad: var(--tv-pad); --cb-gap: var(--tv-gap); --cb-hmin: 0px;
}

/* Text scales with density wherever it's set, not only on body. */
[data-density] { font-size: var(--cb-fs); --cb-type-fs: initial; }

body {
  margin: 0; background: var(--background); color: var(--foreground);
  font-family: var(--font-sans); font-size: var(--cb-fs); line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1;
}
.cb-icon { flex: none; display: inline-block; vertical-align: middle; }

/* Tone plumbing: --cb-tone / --cb-tone-on for anything with .cb-tone--x */
.cb-tone--neutral     { --cb-tone: var(--muted-foreground); --cb-tone-fill: var(--secondary); --cb-tone-on: var(--secondary-foreground); }
.cb-tone--primary     { --cb-tone: var(--info); --cb-tone-fill: var(--primary); --cb-tone-on: var(--primary-foreground); }
.cb-tone--info        { --cb-tone: var(--info); --cb-tone-fill: var(--primary); --cb-tone-on: var(--primary-foreground); }
.cb-tone--success     { --cb-tone: var(--success); --cb-tone-fill: var(--success-fill); --cb-tone-on: var(--fill-foreground); }
.cb-tone--warning     { --cb-tone: var(--warning); --cb-tone-fill: var(--warning-fill); --cb-tone-on: var(--fill-foreground); }
.cb-tone--destructive { --cb-tone: var(--destructive); --cb-tone-fill: var(--destructive-fill); --cb-tone-on: var(--fill-foreground); }
.cb-tone--heat        { --cb-tone: var(--heat); --cb-tone-fill: var(--heat-fill); --cb-tone-on: var(--fill-foreground); }
.cb-tone--cool        { --cb-tone: var(--cool); --cb-tone-fill: var(--cool-fill); --cb-tone-on: var(--fill-foreground); }
.cb-tone--lamp        { --cb-tone: var(--lamp); --cb-tone-fill: var(--lamp-fill); --cb-tone-on: var(--fill-foreground); }
/* --cb-tone is the colour for words, icons and marks; --cb-tone-fill the bright fill behind dark ink (--cb-tone-on).
   Tints mix the fill into the surface, stronger in light, where a bright colour on white needs more of itself to show. */
:root, [data-theme="light"] { --cb-tint: 1.45; }
[data-theme="dark"], .dark { --cb-tint: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cb-tint: 1; } }

/* Focus: one ring for everything pressable */
.cb-btn:focus-visible, .cb-switch:focus-visible, .cb-seg__item:focus-visible, .cb-stepper__btn:focus-visible,
.cb-tile:focus-visible, .cb-dock__item:focus-visible, .cb-input:focus-within, .cb-slider input:focus-visible {
  outline: 2px solid transparent; box-shadow: var(--focus-ring);
}

/* ---------------------------------------------------------------- Button */
.cb-btn {
  font: inherit; font-size: var(--cb-fs); font-weight: 600; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: var(--cb-h); min-width: var(--hit-min); padding: 0 calc(var(--cb-h) * .5);
  border-radius: var(--radius-full); border: 1px solid transparent; cursor: pointer;
  white-space: nowrap; transition: background-color .16s ease, color .16s ease, transform .1s ease;
  -webkit-tap-highlight-color: transparent;
}
.cb-btn:active:not(:disabled) { transform: scale(.97); }
.cb-btn:disabled { cursor: not-allowed; background: var(--muted); color: var(--muted-foreground); border-color: transparent; }
.cb-btn--default { background: var(--primary); color: var(--primary-foreground); }
.cb-btn--default:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 88%, var(--foreground)); }
.cb-btn--secondary { background: var(--secondary); color: var(--secondary-foreground); }
.cb-btn--secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--secondary) 86%, var(--foreground)); }
.cb-btn--outline { background: transparent; color: var(--foreground); border-color: var(--input); }
.cb-btn--outline:hover:not(:disabled), .cb-btn--ghost:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }
.cb-btn--ghost { background: transparent; color: var(--foreground); }
.cb-btn--destructive { background: var(--destructive); color: var(--destructive-foreground); }
.cb-btn--link { background: none; color: var(--info); padding: 0 var(--space-1); min-width: 0; text-decoration: underline; text-underline-offset: 3px; }
.cb-btn--size-sm { height: max(calc(var(--cb-h) * .8), var(--cb-hmin)); font-size: calc(var(--cb-fs) * .92); padding: 0 calc(var(--cb-h) * .4); }
.cb-btn--size-lg { height: calc(var(--cb-h) * 1.2); padding: 0 calc(var(--cb-h) * .6); }
/* confirm="hold": the pill fills from the left while it's held; letting go early empties it. */
.cb-btn--hold { position: relative; overflow: hidden; isolation: isolate; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.cb-btn--hold::before {
  content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; background: currentColor; opacity: .24;
  transform: scaleX(0); transform-origin: left center; transition: transform .18s ease;
}
.cb-btn--hold.is-holding::before { transform: scaleX(1); transition: transform var(--cb-hold, 600ms) linear; }
.cb-btn--hold.is-holding { transform: none; }
.cb-btn--size-icon { width: var(--cb-h); padding: 0; }

/* ----------------------------------------------------------------- Badge */
.cb-badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  font-size: calc(var(--cb-fs) * .8); font-weight: 600; line-height: 1;
  padding: .45em .7em; border-radius: var(--radius-full); white-space: nowrap;
}
.cb-badge--soft { background: color-mix(in srgb, var(--cb-tone-fill) calc(18% * var(--cb-tint)), var(--card)); color: var(--foreground); }
.cb-badge--soft .cb-icon, .cb-badge--outline .cb-icon { color: var(--cb-tone); }
.cb-badge--soft.cb-tone--neutral { background: var(--secondary); color: var(--secondary-foreground); }
.cb-badge--solid { background: var(--cb-tone-fill); color: var(--cb-tone-on); }
.cb-badge--outline { box-shadow: inset 0 0 0 1px var(--cb-tone); color: var(--foreground); }
.cb-badge--outline.cb-tone--neutral { box-shadow: inset 0 0 0 1px var(--input); color: var(--foreground); }

/* ------------------------------------------------------------------ Card */
.cb-card {
  background: var(--card); color: var(--card-foreground); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: var(--cb-gap);
  padding: var(--cb-pad);
}
.cb-card--float { background: var(--popover); box-shadow: var(--shadow-float); }
.cb-card--glass { background: linear-gradient(180deg, var(--glass-sheen), transparent 55%), var(--glass); box-shadow: var(--shadow-glass);
  -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(180%); backdrop-filter: blur(var(--blur-glass)) saturate(180%);
  --muted-foreground: var(--glass-muted-foreground); }
.cb-card--flush { padding: 0; overflow: hidden; }
.cb-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
.cb-card__title { margin: 0; font-size: calc(var(--cb-fs) * 1.2); line-height: 1.3; font-weight: 600; }
.cb-card__desc { margin: var(--space-1) 0 0; color: var(--muted-foreground); font-size: calc(var(--cb-fs) * .9); }
.cb-card__foot { display: flex; gap: var(--space-2); justify-content: flex-end; }

/* --------------------------------------------------------------- Section */
.cb-section { display: flex; flex-direction: column; gap: var(--cb-stack-gap, var(--space-3)); min-width: 0; }
.cb-section__head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); }
.cb-section__title { margin: 0; font-size: calc(var(--cb-fs) * 1.2); line-height: 1.3; font-weight: 600; }
.cb-section__desc { margin: var(--space-1) 0 0; color: var(--muted-foreground); font-size: calc(var(--cb-fs) * .9); }

/* The text styles follow density, as the components do (17px body at touch, the default). The frozen Desk finish
   keeps them at their 15px body (--cb-type-fs) unless a density is set inside it. */
.cb-t-body { font-size: var(--cb-type-fs, var(--cb-fs)); }
.cb-t-heading { font-size: calc(var(--cb-type-fs, var(--cb-fs)) * 1.2); line-height: 1.33; }
.cb-t-title { font-size: calc(var(--cb-type-fs, var(--cb-fs)) * 1.6); line-height: 1.33; }
.cb-t-label { font-size: calc(var(--cb-type-fs, var(--cb-fs)) * .87); }

/* ----------------------------------------------------------------- Input */
.cb-field { display: flex; flex-direction: column; gap: var(--space-2); }
.cb-field__label { font-size: calc(var(--cb-fs) * .87); font-weight: 500; color: var(--muted-foreground); }
.cb-field__hint { margin: 0; font-size: calc(var(--cb-fs) * .85); color: var(--muted-foreground); }
.cb-field--invalid .cb-field__hint { color: var(--destructive); }
.cb-input {
  display: flex; align-items: center; gap: var(--space-2); height: var(--cb-h);
  padding: 0 calc(var(--cb-h) * .35); border-radius: var(--radius-md);
  background: var(--background); box-shadow: inset 0 0 0 1px var(--input); color: var(--muted-foreground);
}
.cb-field--invalid .cb-input { box-shadow: inset 0 0 0 1.5px var(--destructive); }
.cb-input input {
  all: unset; flex: 1; min-width: 0; font: inherit; font-size: var(--cb-fs); color: var(--foreground);
}
.cb-input input::placeholder, .cb-input textarea::placeholder { color: var(--muted-foreground); }
.cb-input--area { height: auto; align-items: stretch; padding-top: calc(var(--cb-h) * .22); padding-bottom: calc(var(--cb-h) * .22); }
.cb-input textarea { all: unset; flex: 1; min-width: 0; font: inherit; font-size: var(--cb-fs); line-height: 1.45; color: var(--foreground); white-space: pre-wrap; resize: vertical; }

/* ---------------------------------------------------------------- Select */
/* The native picker (a wheel on a phone, a menu on a desktop) in Input's clothes. */
.cb-select { position: relative; padding-right: 0; }
.cb-select select { all: unset; flex: 1; min-width: 0; align-self: center; font: inherit; line-height: 1.4; padding-top: calc((var(--cb-h) - 1.4em) / 2 - 1px); padding-bottom: calc((var(--cb-h) - 1.4em) / 2 - 1px); font-size: var(--cb-fs); color: var(--foreground); cursor: pointer;
  padding-right: calc(var(--cb-icon) + var(--space-3) + calc(var(--cb-h) * .35)); }
.cb-select.is-empty select { color: var(--muted-foreground); }
.cb-select option { color: var(--foreground); background: var(--popover); }
.cb-select__chevron { position: absolute; right: calc(var(--cb-h) * .35); pointer-events: none; color: var(--muted-foreground); }

/* ---------------------------------------------------------------- Switch */
.cb-switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); min-height: var(--hit-min); }
.cb-switch-row__text { display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.cb-switch-row__label { font-weight: 500; }
.cb-switch-row__desc { font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); }
.cb-switch {
  all: unset; box-sizing: border-box; flex: none; cursor: pointer; position: relative;
  width: calc(var(--cb-h) * 1.3); height: calc(var(--cb-h) * .75); border-radius: var(--radius-full);
  background: var(--secondary); box-shadow: inset 0 0 0 1px var(--input); transition: background-color .18s ease;
}
.cb-switch__thumb {
  position: absolute; top: 50%; left: calc(var(--cb-h) * .09);
  width: calc(var(--cb-h) * .57); height: calc(var(--cb-h) * .57); border-radius: var(--radius-full);
  background: var(--foreground); transform: translateY(-50%); transition: left .18s ease;
}
.cb-switch.is-on { background: var(--primary); box-shadow: none; }
.cb-switch.is-on .cb-switch__thumb { left: calc(100% - var(--cb-h) * .66); background: var(--primary-foreground); }
.cb-switch:disabled { opacity: .45; cursor: not-allowed; }

/* ---------------------------------------------------------------- Layout */
/* Stack: flex with a token gap. Grid: as many equal columns of at least --cb-grid-min as fit.
   Split: a fixed-width aside beside a main column; when the main column would drop under --cb-split-min of the
   row, both go full width and stack (aside first, or main first with side="end"). No media queries. */
.cb-stack { display: flex; flex-direction: column; gap: var(--cb-stack-gap, var(--space-3)); min-width: 0; }
.cb-stack--row { flex-direction: row; align-items: center; }
.cb-stack--wrap { flex-wrap: wrap; }
.cb-grid { display: grid; gap: var(--cb-grid-gap, var(--space-3)); grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--cb-grid-min, 160px)), 1fr)); }
.cb-grid--fit { grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--cb-grid-min, 160px)), 1fr)); }
.cb-split { display: flex; flex-wrap: wrap; gap: var(--cb-split-gap, var(--space-5)); }
.cb-split__aside { flex: 1 1 var(--cb-split-aside, 280px); min-width: 0; }
.cb-split__main { flex: 999 1 0; min-width: var(--cb-split-min, 55%); }

/* ------------------------------------------------------------------ List */
/* Rows grouped on one card, divided by an inset hairline. A row is a button when it does something. */
.cb-list { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.cb-list__label { margin: 0 0 0 var(--cb-pad); font-size: calc(var(--cb-fs) * .8); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
.cb-list__desc { margin: 0 var(--cb-pad); font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); }
.cb-list__rows { background: var(--card); color: var(--card-foreground); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; }
.cb-list--plain .cb-list__rows { background: transparent; box-shadow: none; border-radius: 0; overflow: visible; margin: 0 calc(var(--space-3) * -1); }
.cb-list--plain .cb-row { padding-left: var(--space-3); padding-right: var(--space-3); border-radius: var(--radius-md); }
.cb-list--plain .cb-list__item + .cb-list__item .cb-row::before { left: var(--space-3); right: var(--space-3); }
.cb-list--plain .cb-list__item + .cb-list__item .cb-row--icon::before { left: calc(var(--space-3) + var(--cb-h) * .9 + var(--cb-gap)); }
.cb-list__item + .cb-list__item .cb-row::before {
  content: ""; position: absolute; top: 0; left: var(--cb-pad); right: 0; height: 1px; background: var(--border);
}
.cb-list__item + .cb-list__item .cb-row--icon::before { left: calc(var(--cb-pad) + var(--cb-h) * .9 + var(--cb-gap)); }
.cb-list__item + .cb-list__item .cb-row.is-selected::before { display: none; }
.cb-list__item:has(.is-selected) + .cb-list__item .cb-row::before { display: none; }
.cb-row {
  all: unset; box-sizing: border-box; position: relative; width: 100%;
  display: flex; align-items: center; gap: var(--cb-gap); min-height: calc(var(--cb-h) * 1.3);
  padding: var(--space-2) var(--cb-pad); color: inherit; text-decoration: none;
}
.cb-row--action { cursor: pointer; transition: background-color .16s ease; -webkit-tap-highlight-color: transparent; }
.cb-row--action:hover { background: var(--accent); }
.cb-row--action:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.cb-row--action:disabled { cursor: not-allowed; opacity: .5; }
.cb-row.is-selected { background: var(--secondary); }
.cb-row.is-selected::after { content: ""; position: absolute; left: 0; top: var(--space-2); bottom: var(--space-2); width: 3px; border-radius: 0 var(--radius-full) var(--radius-full) 0; background: var(--info); }
.cb-glass .cb-row.is-selected, .cb-card--glass .cb-row.is-selected { background: var(--glass-control); }
.cb-row__icon {
  flex: none; display: grid; place-items: center; width: calc(var(--cb-h) * .9); height: calc(var(--cb-h) * .9);
  border-radius: var(--radius-md); background: var(--secondary); color: var(--muted-foreground);
}
.cb-row[class*="cb-tone--"] .cb-row__icon { color: var(--cb-tone); }
.cb-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cb-row__title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cb-row__desc { font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); }
.cb-row__value { flex: none; color: var(--muted-foreground); font-feature-settings: "tnum" 1; }
.cb-row__trail { flex: none; display: flex; align-items: center; gap: var(--space-2); }
.cb-row__chevron { color: var(--muted-foreground); margin-right: calc(var(--space-1) * -1); }

/* ---------------------------------------------------------------- Slider */
.cb-slider { display: flex; flex-direction: column; gap: var(--space-2); }
.cb-slider__top { display: flex; justify-content: space-between; align-items: baseline; }
.cb-slider__label { font-size: calc(var(--cb-fs) * .87); font-weight: 500; color: var(--muted-foreground); }
.cb-slider__value { font-weight: 600; }
.cb-slider__row { display: flex; align-items: center; gap: var(--space-3); color: var(--muted-foreground); }
.cb-slider input {
  -webkit-appearance: none; appearance: none; flex: 1; margin: 0; cursor: pointer;
  height: calc(var(--cb-h) * .7); border-radius: var(--radius-full); background: transparent;
}
.cb-slider input::-webkit-slider-runnable-track {
  height: calc(var(--cb-h) * .7); border-radius: var(--radius-full);
  background: linear-gradient(to right, var(--primary) var(--cb-fill), var(--muted) var(--cb-fill));
  box-shadow: inset 0 0 0 1px var(--border);
}
.cb-slider input::-moz-range-track { height: calc(var(--cb-h) * .7); border-radius: var(--radius-full); background: var(--muted); }
.cb-slider input::-moz-range-progress { height: calc(var(--cb-h) * .7); border-radius: var(--radius-full); background: var(--primary); }
.cb-slider input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: calc(var(--cb-h) * .7); height: calc(var(--cb-h) * .7);
  border-radius: var(--radius-full); background: var(--primary-foreground); box-shadow: 0 0 0 3px var(--primary), var(--shadow-thumb);
}
.cb-slider input::-moz-range-thumb {
  width: calc(var(--cb-h) * .7); height: calc(var(--cb-h) * .7); border: 0;
  border-radius: var(--radius-full); background: var(--primary-foreground); box-shadow: 0 0 0 3px var(--primary), var(--shadow-thumb);
}
/* tone: a light's brightness fills in `lamp`. track="kelvin": the colour of the light, warm to cool, no fill. */
.cb-slider[class*="cb-tone--"] input::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--cb-tone-fill) var(--cb-fill), var(--muted) var(--cb-fill)); }
.cb-slider[class*="cb-tone--"] input::-moz-range-progress { background: var(--cb-tone-fill); }
.cb-slider[class*="cb-tone--"] input::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--cb-tone-fill), var(--shadow-thumb); }
.cb-slider[class*="cb-tone--"] input::-moz-range-thumb { box-shadow: 0 0 0 3px var(--cb-tone-fill), var(--shadow-thumb); }
.cb-slider.cb-slider--kelvin input::-webkit-slider-runnable-track { background: var(--cb-track); }
.cb-slider.cb-slider--kelvin input::-moz-range-track { background: var(--cb-track); }
.cb-slider.cb-slider--kelvin input::-moz-range-progress { background: transparent; }
.cb-slider.cb-slider--kelvin input::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--foreground), var(--shadow-thumb); }
.cb-slider.cb-slider--kelvin input::-moz-range-thumb { box-shadow: 0 0 0 3px var(--foreground), var(--shadow-thumb); }

/* ------------------------------------------------------------- Segmented */
.cb-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-full); background: var(--secondary); }
.cb-seg--fill { display: flex; }
.cb-seg--fill .cb-seg__item { flex: 1; }
.cb-seg__item {
  all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: calc(var(--cb-h) - 6px); min-width: calc(var(--cb-h) - 6px); padding: 0 calc(var(--cb-h) * .4);
  border-radius: var(--radius-full); font-weight: 500; color: var(--muted-foreground); transition: background-color .16s ease, color .16s ease;
}
.cb-seg__item:hover { color: var(--foreground); }
.cb-seg__item.is-active { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-card); font-weight: 600; }

/* --------------------------------------------------------------- Stepper */
.cb-stepper { display: inline-flex; align-items: center; gap: var(--space-3); }
.cb-stepper__btn {
  all: unset; box-sizing: border-box; cursor: pointer; display: grid; place-items: center;
  width: var(--cb-h); height: var(--cb-h); border-radius: var(--radius-full);
  background: var(--secondary); color: var(--secondary-foreground);
}
.cb-stepper__btn:active:not(:disabled) { transform: scale(.94); }
.cb-stepper__btn:disabled { opacity: .4; cursor: not-allowed; }
.cb-stepper__val { display: grid; grid-template-columns: auto auto; align-items: start; justify-content: center; justify-items: center; min-width: calc(var(--cb-h) * 1.6); }
.cb-stepper__reading { grid-column: 1 / -1; display: inline-flex; align-items: baseline; white-space: nowrap; }
.cb-stepper__unit, .cb-gauge__reading .cb-gauge__unit { margin-left: .25em; }
.cb-stepper__unit.is-tight, .cb-gauge__reading .cb-gauge__unit.is-tight { margin-left: .05em; }
/* a degree sign reads as a superscript, as it's written: 70° */
.cb-stepper__unit.is-deg, .cb-gauge__reading .cb-gauge__unit.is-deg { align-self: flex-start; margin-top: .2em; }
.cb-stepper__num { font-size: calc(var(--cb-fs) * 2.15); font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
.cb-stepper__unit { font-size: calc(var(--cb-fs) * 1.1); color: var(--muted-foreground); line-height: 1.2; }
.cb-stepper__label { grid-column: 1 / -1; font-size: calc(var(--cb-fs) * .8); font-weight: 500; color: var(--muted-foreground); margin-top: var(--space-1); }

/* -------------------------------------------------------------- Progress */
.cb-progress { display: flex; flex-direction: column; gap: var(--space-2); }
.cb-progress__top { display: flex; justify-content: space-between; font-size: calc(var(--cb-fs) * .87); }
.cb-progress__label { color: var(--muted-foreground); font-weight: 500; }
.cb-progress__value { font-weight: 600; }
.cb-progress__track { height: calc(var(--cb-h) * .2); min-height: 6px; border-radius: var(--radius-full); background: var(--muted); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
.cb-progress__bar { height: 100%; border-radius: inherit; background: var(--cb-tone); transition: width .3s ease; }
.cb-progress__rail { position: relative; }
/* Target: a tick across the track, in foreground so it reads on the fill and off it. */
.cb-progress__target { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; border-radius: var(--radius-full);
  background: var(--foreground); box-shadow: 0 0 0 2px var(--card); }
.cb-progress__target--start { margin-left: 0; } .cb-progress__target--end { margin-left: -3px; }
.cb-progress__targets { position: relative; height: 1.4em; font-size: calc(var(--cb-fs) * .8); color: var(--muted-foreground); }
.cb-progress__target-label { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.cb-progress__target-label.cb-progress__target--start { transform: none; } .cb-progress__target-label.cb-progress__target--end { transform: translateX(-100%); }

/* ----------------------------------------------------------------- Chart */
/* Marks carry the series colour (chart-1 … chart-8); every word stays in text tokens. Hairline solid grid, 2px lines,
   end dots ringed in the surface, bars ≤ 24px with a 2px gap. The surface is card inside a card, else background. */
.cb-chart-host { min-width: 0; }
.cb-chart { position: relative; --cb-chart-surface: var(--background); font-feature-settings: "tnum" 1; }
.cb-card .cb-chart, .cb-list .cb-chart, .cb-table .cb-chart { --cb-chart-surface: var(--card); }
.cb-chart__plot { position: relative; }
.cb-chart__svg { position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; overflow: visible; touch-action: pan-y; outline: none; }
.cb-chart__svg:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-md); }
.cb-chart__legend { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); margin-bottom: var(--space-3); font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); }
.cb-chart__legend[hidden] { display: none; }
.cb-chart__legend-item { display: inline-flex; align-items: center; gap: var(--space-2); }
.cb-chart__key { display: inline-block; flex: none; border-radius: var(--radius-full); }
.cb-chart__key--line { width: 14px; height: 3px; }
.cb-chart__key--box { width: 10px; height: 10px; border-radius: 3px; }
.cb-chart__tick { font-size: calc(var(--cb-fs) * .8); fill: var(--muted-foreground); }
.cb-chart__grid { stroke: var(--border); stroke-width: 1; }
.cb-chart__zero { stroke: var(--input); stroke-width: 1; }
.cb-chart__line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.cb-chart__area { opacity: .12; }
.cb-chart__dot { stroke: var(--cb-chart-surface); stroke-width: 2; }
.cb-chart__end { font-size: calc(var(--cb-fs) * .87); font-weight: 600; fill: var(--foreground); }
.cb-chart__band { fill: var(--success); opacity: .1; }
.cb-chart__band[data-zone] { fill: var(--cb-zone); opacity: .14; }
.cb-chart__band-label { font-size: calc(var(--cb-fs) * .8); font-weight: 500; fill: var(--muted-foreground); paint-order: stroke; stroke: var(--cb-chart-surface); stroke-width: 4px; stroke-linejoin: round; }
.cb-chart__target { stroke: var(--muted-foreground); stroke-width: 1.5; }
.cb-chart__crosshair { stroke: var(--muted-foreground); stroke-width: 1; }
.cb-chart__column { fill: var(--accent); }
.cb-chart__empty { font-size: var(--cb-fs); fill: var(--muted-foreground); }
.cb-chart__tip {
  position: absolute; z-index: 2; pointer-events: none; min-width: 120px; white-space: nowrap;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--popover); color: var(--popover-foreground);
  box-shadow: var(--shadow-float); font-size: calc(var(--cb-fs) * .87); display: flex; flex-direction: column; gap: 2px;
}
.cb-chart__tip[hidden] { display: none; }
.cb-chart__tip-x { color: var(--muted-foreground); margin-bottom: 2px; }
.cb-chart__tip-row { display: flex; align-items: center; gap: var(--space-2); }
.cb-chart__tip-row strong { font-weight: 600; }
.cb-chart__tip-label { color: var(--muted-foreground); }
.cb-chart__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------- Toolbar, Page */
.cb-toolbar {
  container-type: inline-size; display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-3); row-gap: var(--space-2);
  min-height: calc(var(--cb-h) + var(--space-4)); padding-block: var(--space-2); box-sizing: border-box;
}
.cb-toolbar--sticky { position: sticky; top: 0; z-index: var(--z-chrome); background: var(--background); }
.cb-toolbar__title { margin: 0; flex: none; font-size: calc(var(--cb-fs) * 1.33); font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
.cb-toolbar__search { flex: 1 1 220px; min-width: 0; max-width: 480px; }
.cb-toolbar__search .cb-field { min-width: 0; }
.cb-toolbar__actions { display: flex; align-items: center; gap: var(--space-1); margin-left: auto; flex: none; }
/* a phone: title and actions share the first row, search gets its own */
@container (max-width: 520px) {
  .cb-toolbar__search { order: 3; flex-basis: 100%; max-width: none; }
}
.cb-page { width: 100%; max-width: var(--cb-page-w, 1080px); margin-inline: auto; padding-inline: clamp(var(--space-3), 4vw, var(--space-6)); box-sizing: border-box; }

/* ---------------------------------------------------------- Table, stacked */
/* narrow="stack": under 560px of width each row becomes a block, the first column its title, any actions column at its
   top right, and the rest label-and-value lines, so nothing sits off screen. */
.cb-table--stack { container-type: inline-size; }
.cb-table td.is-actions { width: 1%; white-space: nowrap; }
@container (max-width: 560px) {
  .cb-table.cb-table--stack table, .cb-table.cb-table--stack tbody { display: block; }
  .cb-table.cb-table--stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .cb-table.cb-table--stack tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--space-3); row-gap: 2px; align-items: center; padding: var(--space-3) var(--cb-pad); border-top: 1px solid var(--border); }
  .cb-table.cb-table--stack tbody tr:first-child { border-top: 0; }
  .cb-table.cb-table--stack td { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 0; height: auto; padding: 0 !important; border: 0; white-space: normal; text-align: right; position: static !important; box-shadow: none !important; background: transparent; }
  .cb-table.cb-table--stack td::before { content: attr(data-label); color: var(--muted-foreground); font-size: calc(var(--cb-fs) * .87); text-align: left; }
  .cb-table.cb-table--stack td:first-child { grid-column: 1; grid-row: 1; justify-content: flex-start; text-align: left; font-weight: 600; }
  .cb-table.cb-table--stack td:first-child::before, .cb-table.cb-table--stack td.is-actions::before, .cb-table.cb-table--stack td:not([data-label])::before { content: none; }
  .cb-table.cb-table--stack td.is-actions { grid-column: 2; grid-row: 1; width: auto; justify-content: flex-end; }
  .cb-table.cb-table--stack tr.is-selected { background: var(--secondary); box-shadow: inset 3px 0 0 var(--info); }
  .cb-table.cb-table--stack .cb-table__empty { justify-content: center; }
}

/* A modal sheet sits where toasts do; while one is open they show at the top instead. */
body:has(.cb-scrim--sheet.cb-scrim--fixed) .cb-toasts { top: var(--space-6); bottom: auto; }

/* -------------------------------------------------------------- Overlays */
/* Menus, popovers and tooltips live in <body>, carry the density, theme and finish of what opened them, and are solid
   (popover), not glass: they sit over resting content, and glass is for what interrupts moving content. */
.cb-anchor { display: inline-flex; max-width: 100%; vertical-align: middle; }
.cb-menu, .cb-popover {
  position: fixed; z-index: var(--z-popover); min-width: 200px; max-width: min(360px, calc(100vw - var(--space-4)));
  overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box;
  background: var(--popover); color: var(--popover-foreground); border-radius: var(--radius-lg); box-shadow: var(--shadow-float);
  font-family: var(--font-sans); font-size: var(--cb-fs); outline: none;
  animation: cb-pop .12s ease-out;
}
.cb-menu[hidden], .cb-popover[hidden], .cb-tooltip[hidden] { display: none; }
.cb-menu { display: flex; flex-direction: column; padding: var(--space-1); }
.cb-menu__item {
  display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: max(calc(var(--cb-h) * .9), var(--cb-hmin)); padding: var(--space-1) var(--space-3);
  border: 0; border-radius: var(--radius-md); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cb-menu__item:focus { outline: none; background: var(--accent); color: var(--accent-foreground); }
.cb-menu__item:focus-visible { box-shadow: inset 0 0 0 2px var(--ring); }
.cb-menu__item.is-destructive { color: var(--destructive); }
.cb-menu__item[aria-disabled="true"] { color: var(--muted-foreground); cursor: not-allowed; }
.cb-menu__item[aria-disabled="true"]:focus { background: transparent; }
.cb-menu__icon { flex: none; width: var(--cb-icon); height: var(--cb-icon); color: var(--muted-foreground); }
.cb-menu__item.is-destructive .cb-menu__icon { color: inherit; }
.cb-menu__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cb-menu__label { line-height: 1.3; }
.cb-menu__desc { font-size: .87em; line-height: 1.3; color: var(--muted-foreground); }
.cb-menu__kbd { font-family: var(--font-mono); font-size: .8em; color: var(--muted-foreground); }
.cb-menu__check { flex: none; width: var(--cb-icon); height: var(--cb-icon); color: var(--info); }
.cb-menu__sep { height: 1px; margin: var(--space-1) calc(var(--space-1) * -1); background: var(--border); flex: none; }
.cb-menu__heading { padding: var(--space-2) var(--space-3) var(--space-1); font-size: calc(var(--cb-fs) * .8); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
.cb-popover { padding: var(--cb-pad); }
.cb-tooltip {
  position: fixed; z-index: var(--z-popover); max-width: 240px; padding: var(--space-1) var(--space-2); box-sizing: border-box;
  border-radius: var(--radius-md); background: var(--foreground); color: var(--background); box-shadow: var(--shadow-float);
  font-family: var(--font-sans); font-size: calc(var(--cb-fs) * .87); font-weight: 500; line-height: 1.35;
  animation: cb-pop .12s ease-out;
}
.cb-menu[data-finish="lit"], .cb-popover[data-finish="lit"], [data-finish="lit"] .cb-menu, [data-finish="lit"] .cb-popover { background: var(--lit-surface); box-shadow: var(--shadow-lit); }
@keyframes cb-pop { from { opacity: 0; transform: translateY(-4px); } }
[data-side="top"].cb-menu, [data-side="top"].cb-popover, [data-side="top"].cb-tooltip { animation-name: cb-pop-up; }
@keyframes cb-pop-up { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { .cb-menu, .cb-popover, .cb-tooltip { animation: none; } }

/* A modal panel takes focus itself only when it has no field to give it to; it doesn't draw a ring for that. */
.cb-dialog:focus, .cb-sheet:focus { outline: none; }

/* ----------------------------------------------------------------- Zones */
.cb-zone-badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 2.4em; height: 1.6em; padding: 0 .4em;
  border-radius: var(--radius-full); background: var(--cb-zone, var(--zone-1)); color: var(--zone-foreground);
  font-size: calc(var(--cb-fs) * .8); font-weight: 600; font-feature-settings: "tnum" 1; flex: none;
}
.cb-zones { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-3); }
.cb-zones__row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: var(--space-3); row-gap: var(--space-2); align-items: center; }
.cb-zones__text { display: flex; flex-direction: column; min-width: 0; }
.cb-zones__name { font-weight: 500; line-height: 1.3; }
.cb-zones__range, .cb-zones__share { font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); line-height: 1.3; }
.cb-zones__amount { display: flex; flex-direction: column; align-items: flex-end; font-feature-settings: "tnum" 1; }
.cb-zones__value { font-weight: 600; line-height: 1.3; }
.cb-zones__bar { grid-column: 1 / -1; height: 6px; border-radius: var(--radius-full); background: var(--muted); overflow: hidden; }
.cb-zones__bar > span { display: block; height: 100%; min-width: 6px; border-radius: inherit; background: var(--cb-zone); transition: width .3s ease; }
.cb-zones__bar > span[data-empty] { min-width: 0; }
.cb-zones__row.is-current .cb-zones__name { font-weight: 700; }
[data-finish="lit"] .cb-zones__bar { background: var(--background); box-shadow: var(--shadow-well); }

/* ----------------------------------------------------------------- Meter */
/* The band is the target range (success-tinted), the dot is the value in its state's tone, the state said in words. */
.cb-meter { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.cb-meter__top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); font-size: calc(var(--cb-fs) * .87); }
.cb-meter__label { color: var(--muted-foreground); font-weight: 500; }
.cb-meter__value { display: inline-flex; align-items: baseline; gap: var(--space-1); font-feature-settings: "tnum" 1; }
.cb-meter__num { font-weight: 600; color: var(--foreground); }
.cb-meter__unit { color: var(--muted-foreground); }
.cb-meter__state { margin-left: var(--space-2); font-weight: 600; color: var(--cb-tone); }
.cb-meter--lg { gap: var(--space-3); }
.cb-meter--lg .cb-meter__top { flex-direction: column; align-items: flex-start; gap: var(--space-1); font-size: var(--cb-fs); }
.cb-meter--lg .cb-meter__label { font-size: calc(var(--cb-fs) * .87); }
.cb-meter--lg .cb-meter__num { font-size: 32px; font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
.cb-meter--lg .cb-meter__state { font-size: calc(var(--cb-fs) * .87); }
.cb-meter__track { position: relative; height: calc(var(--cb-h) * .2); min-height: 6px; border-radius: var(--radius-full); background: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
.cb-meter__band { position: absolute; top: 0; bottom: 0; border-radius: var(--radius-full); background: color-mix(in srgb, var(--success) 38%, var(--muted)); }
.cb-meter__dot { position: absolute; top: 50%; width: calc(var(--cb-h) * .38); height: calc(var(--cb-h) * .38); min-width: 14px; min-height: 14px;
  border-radius: var(--radius-full); background: var(--cb-tone); box-shadow: 0 0 0 3px var(--card); transform: translate(-50%, -50%); transition: left .3s ease; }

/* ---------------------------------------------------------------- Notice */
.cb-notice {
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-3); padding: var(--cb-pad);
  border-radius: var(--radius-lg); background: color-mix(in srgb, var(--cb-tone-fill) calc(12% * var(--cb-tint)), var(--card));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cb-tone-fill) calc(35% * var(--cb-tint)), transparent);
}
.cb-notice__icon { color: var(--cb-tone); margin-top: 1px; }
.cb-notice__text { flex: 1 1 12em; min-width: 0; }
.cb-notice__title { margin: 0; font-weight: 600; }
.cb-notice__body { color: var(--muted-foreground); margin-top: 2px; }
/* The action sits beside the text, and drops under it, at the right, when the notice is narrow. */
.cb-notice__action { flex: none; align-self: center; margin-left: auto; }
/* A default button in a notice takes the notice's tone (success fills green, destructive red…), flat in either finish. */
.cb-notice__action .cb-btn--default, [data-finish="lit"] .cb-notice__action .cb-btn--default, [data-finish="glass"] .cb-notice__action .cb-btn--default { background: var(--cb-tone-fill); color: var(--cb-tone-on); box-shadow: none; }
.cb-notice__action .cb-btn--default:hover:not(:disabled), [data-finish="lit"] .cb-notice__action .cb-btn--default:hover:not(:disabled),
[data-finish="glass"] .cb-notice__action .cb-btn--default:hover:not(:disabled) { background: color-mix(in srgb, var(--cb-tone-fill) 88%, var(--foreground)); }

/* --------------------------------------------------------------- Readout */
.cb-readout { display: inline-flex; flex-direction: column; gap: var(--space-1); }
.cb-readout--center { align-items: center; text-align: center; }
.cb-readout__label { font-size: calc(var(--cb-fs) * .8); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
.cb-readout__line { display: inline-flex; align-items: baseline; gap: var(--space-2); }
.cb-readout__value { font-weight: 300; line-height: 1; font-feature-settings: "tnum" 1; color: var(--foreground); }
.cb-readout[class*="cb-tone--"]:not(.cb-tone--neutral) .cb-readout__value { color: var(--cb-tone); }
/* Units as written (mph, kW, °F, pH): never transformed, since case carries meaning. */
.cb-readout__unit { font-size: calc(var(--cb-fs) * .87); font-weight: 500; color: var(--muted-foreground); }
.cb-readout--xl .cb-readout__value { font-size: 96px; letter-spacing: -0.04em; }
.cb-readout--lg .cb-readout__value { font-size: 56px; letter-spacing: -0.03em; }
.cb-readout--md .cb-readout__value { font-size: 32px; font-weight: 400; letter-spacing: -0.02em; }
.cb-readout--xl .cb-readout__unit { font-size: calc(var(--cb-fs) * 1.07); }
/* A degree sign sits at the top of the number, close to it, as it's written (67°, not 67 °). */
.cb-readout__line .cb-readout__unit.is-deg { align-self: flex-start; margin-left: calc(var(--space-2) * -1 + 2px); font-weight: 300; line-height: 1; color: var(--muted-foreground); }
.cb-readout--xl .cb-readout__unit.is-deg { font-size: 40px; margin-top: 8px; }
.cb-readout--lg .cb-readout__unit.is-deg { font-size: 24px; margin-top: 4px; }
.cb-readout--md .cb-readout__unit.is-deg { font-size: 15px; margin-top: 3px; }

/* ----------------------------------------------------------------- Gauge */
.cb-gauge { position: relative; display: inline-block; }
.cb-gauge svg { position: absolute; inset: 0 auto auto 0; overflow: visible; }
.cb-gauge__track { fill: none; stroke: var(--muted); stroke-linecap: round; }
.cb-gauge__fill { fill: none; stroke: var(--cb-tone); stroke-linecap: round; transition: d .3s ease; }
.cb-gauge__center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 6%; }
.cb-gauge__value { font-size: calc(var(--cb-gauge-size, 180px) * .22); font-weight: 300; letter-spacing: -0.03em; line-height: 1; }
.cb-gauge__reading { display: inline-flex; align-items: baseline; white-space: nowrap; }
.cb-gauge__unit { font-size: calc(var(--cb-fs) * .87); font-weight: 500; color: var(--muted-foreground); }
/* markup from before 0.14 (the unit as the value's sibling) keeps its look: unit under the value */
.cb-gauge__center > .cb-gauge__unit { font-size: calc(var(--cb-fs) * .8); margin-top: var(--space-1); }
.cb-gauge__label { font-size: calc(var(--cb-fs) * .87); font-weight: 500; color: var(--muted-foreground); margin-top: 2px; }

/* ----------------------------------------------------------- ControlTile */
.cb-tile {
  all: unset; box-sizing: border-box; cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: var(--space-2);
  min-height: calc(var(--cb-h) * 2.4); min-width: calc(var(--cb-h) * 2.4); padding: var(--cb-pad);

  transition: background-color .16s ease, transform .1s ease;

.cb-tile:active { transform: scale(.98); }
.cb-tile__icon { width: var(--icon-xl); height: var(--icon-xl); color: var(--muted-foreground); }
.cb-tile__label { font-weight: 600; }
.cb-tile__status { font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); margin-top: -6px; }
.cb-tile.is-on { background: color-mix(in srgb, var(--cb-tone-fill) calc(14% * var(--cb-tint)), var(--card)); box-shadow: inset 0 0 0 1.5px var(--cb-tone); }
.cb-tile.is-on .cb-tile__icon { color: var(--cb-tone); }
.cb-tile__levels { position: absolute; top: var(--cb-pad); right: var(--cb-pad); display: flex; gap: 3px; }
.cb-tile__pip { width: 6px; height: 14px; border-radius: var(--radius-full); background: var(--muted); box-shadow: inset 0 0 0 1px var(--input); }
.cb-tile__pip.is-lit { background: var(--cb-tone); box-shadow: none; }
/* A level (a light's brightness) as a fill across the tile: stronger up to the level, faint after it. */
.cb-tile.is-on.has-fill {
  background: linear-gradient(to right,
    color-mix(in srgb, var(--cb-tone-fill) calc(30% * var(--cb-tint)), var(--card)) var(--cb-tile-fill),
    color-mix(in srgb, var(--cb-tone-fill) calc(7% * var(--cb-tint)), var(--card)) var(--cb-tile-fill));
}
.cb-tile:disabled { cursor: not-allowed; transform: none; background: var(--muted); box-shadow: none; }
.cb-tile:disabled .cb-tile__label, .cb-tile:disabled .cb-tile__icon { color: var(--muted-foreground); }
.cb-tile__spin {
  position: absolute; top: var(--cb-pad); right: var(--cb-pad); width: 18px; height: 18px; border-radius: var(--radius-full);
  border: 2px solid var(--muted); border-top-color: var(--cb-tone); animation: cb-spin .8s linear infinite;
}
@keyframes cb-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .cb-tile__spin { animation-duration: 2.4s; } }

/* ------------------------------------------------------------- StatusBar */
.cb-statusbar {
  display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(0, auto) minmax(max-content, 1fr); align-items: center; gap: var(--space-4);
  min-height: max(var(--statusbar-h), calc(var(--cb-hmin) + var(--space-2) * 2)); padding: min(var(--cb-hmin), var(--space-1)) var(--space-5); font-size: calc(var(--cb-fs) * .93); font-weight: 500; color: var(--foreground);
  container-type: inline-size;
}
/* Touch and glance bars are as tall as a pressable, so a button in the bar never runs into the screen edge. */
.cb-statusbar .cb-btn { height: var(--hit-min); min-width: var(--hit-min); font-size: inherit; }
.cb-statusbar .cb-btn--size-icon { width: var(--hit-min); padding: 0; }
.cb-statusbar__lead { display: flex; align-items: center; gap: var(--space-3); }
.cb-statusbar__title { font-weight: 600; }
.cb-statusbar__trail { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-4); }
.cb-statusbar__item { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--muted-foreground); }
.cb-statusbar__item.cb-tone--success, .cb-statusbar__item.cb-tone--warning, .cb-statusbar__item.cb-tone--destructive,
.cb-statusbar__item.cb-tone--heat, .cb-statusbar__item.cb-tone--cool { color: var(--cb-tone); }
.cb-statusbar__time { font-weight: 600; font-feature-settings: "tnum" 1; }
.cb-statusbar__item, .cb-statusbar__time { white-space: nowrap; }
.cb-statusbar__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; min-width: 0; }
/* A phone-width bar: tighter gaps, so the title keeps its room. (Ignored where container queries aren't supported.) */
@container (max-width: 480px) {
  .cb-statusbar__lead, .cb-statusbar__trail { gap: var(--space-2); }
  /* items are the first thing to go: the title, the time and your own controls stay */
  .cb-statusbar__item:not(.is-kept) { display: none; }
}

/* ------------------------------------------------------------------ Dock */
.cb-dock {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  height: var(--dock-h); padding: 0 var(--space-5); background: var(--card);
  border-radius: var(--radius-xl); box-shadow: var(--shadow-float);
}
.cb-dock__items { display: flex; align-items: center; gap: var(--space-2); flex: 1; justify-content: center; }
.cb-dock__edge { display: flex; align-items: center; gap: var(--space-3); }
.cb-dock__item {
  all: unset; box-sizing: border-box; cursor: pointer; position: relative; display: grid; place-items: center;
  width: calc(var(--dock-h) - 20px); height: calc(var(--dock-h) - 20px); border-radius: var(--radius-md);
  color: var(--muted-foreground); --cb-icon: var(--icon-lg); transition: background-color .16s ease, color .16s ease;
}
.cb-dock__item:hover { color: var(--foreground); background: var(--accent); }
.cb-dock__item.is-active { color: var(--foreground); background: var(--secondary); }
.cb-dock__item.is-active::after { content: ""; position: absolute; bottom: 5px; width: 16px; height: 3px; border-radius: var(--radius-full); background: var(--info); }
.cb-dock__badge {
  position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
  border-radius: var(--radius-full); background: var(--destructive); color: var(--destructive-foreground);
  font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
}

/* ---------------------------------------------------------- Glass material */
/* Translucent tint + strong backdrop blur and saturation + a top sheen + a light-catching rim.
   Secondary text inside glass switches to glass-muted-foreground automatically. */
.cb-glass {
  background: linear-gradient(180deg, var(--glass-sheen), transparent 55%), var(--glass);
  color: var(--foreground); box-shadow: var(--shadow-glass);
  -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(180%); backdrop-filter: blur(var(--blur-glass)) saturate(180%);
  --muted-foreground: var(--glass-muted-foreground);
}
.cb-glass .cb-btn--secondary, .cb-glass .cb-stepper__btn, .cb-glass .cb-seg, .cb-card--glass .cb-btn--secondary,
.cb-card--glass .cb-stepper__btn, .cb-card--glass .cb-seg { background: var(--glass-control); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .cb-glass, .cb-card--glass { background: var(--popover); }
}

/* ---------------------------------------------------------------- Dialog */
.cb-scrim {
  position: absolute; inset: 0; z-index: var(--z-sheet); display: grid; place-items: center; padding: var(--space-6);
  background: var(--scrim); -webkit-backdrop-filter: blur(var(--blur-scrim)); backdrop-filter: blur(var(--blur-scrim));
}
.cb-scrim--fixed { position: fixed; }
.cb-dialog {
  width: min(100%, var(--cb-dialog-w, 440px)); border-radius: var(--radius-lg); padding: var(--cb-pad);
  display: flex; flex-direction: column; gap: var(--cb-gap); box-sizing: border-box;
}
.cb-dialog__head { display: flex; align-items: flex-start; gap: var(--space-3); }
.cb-dialog__icon { color: var(--cb-tone, var(--info)); margin-top: 4px; }
.cb-dialog__title { margin: 0; font-size: calc(var(--cb-fs) * 1.35); line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
.cb-dialog__desc { margin: var(--space-1) 0 0; color: var(--muted-foreground); }
.cb-dialog__foot { display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; }
.cb-dialog__foot--stack { flex-direction: column-reverse; }
.cb-dialog__foot--stack .cb-btn { width: 100%; }

/* ------------------------------------------------------------------ Tabs */
.cb-tabs { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.cb-tabs__list { display: flex; gap: var(--space-1); overflow-x: auto; scrollbar-width: none; box-shadow: inset 0 -1px 0 var(--border); }
.cb-tabs__list::-webkit-scrollbar { display: none; }
.cb-tabs--fill .cb-tabs__tab { flex: 1; justify-content: center; }
.cb-tabs__tab {
  all: unset; box-sizing: border-box; position: relative; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: var(--space-2);
  height: var(--cb-h); padding: 0 calc(var(--cb-h) * .35); font-weight: 600; color: var(--muted-foreground); white-space: nowrap;
  border-radius: var(--radius-md) var(--radius-md) 0 0; transition: color .16s ease, background-color .16s ease; -webkit-tap-highlight-color: transparent;
}
.cb-tabs__tab:hover { color: var(--foreground); background: var(--accent); }
.cb-tabs__tab.is-active { color: var(--foreground); }
.cb-tabs__tab.is-active::after { content: ""; position: absolute; left: var(--space-2); right: var(--space-2); bottom: 0; height: 3px; border-radius: var(--radius-full) var(--radius-full) 0 0; background: var(--info); }
.cb-tabs__tab:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.cb-tabs__badge { min-width: 1.4em; padding: 0 .4em; box-sizing: border-box; border-radius: var(--radius-full); background: var(--secondary); color: var(--secondary-foreground); font-size: .8em; line-height: 1.5; text-align: center; }
[data-finish="lit"] .cb-tabs__tab.is-active::after { background: var(--glow); box-shadow: var(--shadow-glow); }

/* ----------------------------------------------------------------- Table */
.cb-table { min-width: 0; border-radius: var(--radius-lg); background: var(--card); color: var(--card-foreground); box-shadow: var(--shadow-card); overflow: hidden; }
.cb-table--plain { background: transparent; box-shadow: none; border-radius: 0; }
.cb-table__scroll { overflow-x: auto; position: relative; }
.cb-table table { width: 100%; border-collapse: collapse; font-feature-settings: "tnum" 1; }
.cb-table__caption { margin: 0; padding: var(--space-3) var(--cb-pad) 0; color: var(--muted-foreground); font-size: calc(var(--cb-fs) * .87); }
/* When it scrolls sideways (a phone), the first column stays put, so every row keeps its name: put what identifies a row
   first and what matters most about it second. */
.cb-table.is-overflow th:first-child, .cb-table.is-overflow td:first-child { position: sticky; left: 0; z-index: 1; background-color: var(--card); box-shadow: 1px 0 0 var(--border); }
.cb-table--plain.is-overflow th:first-child, .cb-table--plain.is-overflow td:first-child { background-color: var(--cb-table-surface, var(--background)); }
.cb-table__scroll:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
/* Column labels in sentence case: headers often carry units and case-sensitive names (pH, kWh). */
.cb-table th { text-align: left; padding: var(--space-3) var(--space-3); font-size: calc(var(--cb-fs) * .87); font-weight: 600; color: var(--muted-foreground); white-space: nowrap; }
.cb-table td { padding: 0 var(--space-3); height: calc(var(--cb-h) * 1.2); border-top: 1px solid var(--border); white-space: nowrap; }
.cb-table th:first-child, .cb-table td:first-child { padding-left: var(--cb-pad); }
.cb-table th:last-child, .cb-table td:last-child { padding-right: var(--cb-pad); }
.cb-table .is-end { text-align: right; } .cb-table .is-center { text-align: center; }
.cb-table tr.is-action { cursor: pointer; }
.cb-table tr.is-action:hover td { background: var(--accent); }
.cb-table.is-overflow tr.is-action:hover td:first-child { background-color: var(--accent); }
.cb-table tr.is-action:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.cb-table tr.is-selected td, .cb-table.is-overflow tr.is-selected td:first-child { background-color: var(--secondary); }
.cb-table tr.is-selected td:first-child { box-shadow: inset 3px 0 0 var(--info); }
.cb-table__empty { text-align: center; color: var(--muted-foreground); height: calc(var(--cb-h) * 2) !important; }
[data-finish="lit"] .cb-table:not(.cb-table--plain) { background: var(--lit-surface); box-shadow: var(--shadow-lit); }

/* ----------------------------------------------------------------- Toast */
/* Opaque on popover, not glass: a toast is read in a second, over anything, so nothing may show through it. */
.cb-toast { display: flex; align-items: center; gap: var(--space-3); width: min(100%, 440px); box-sizing: border-box; padding: var(--space-3) var(--space-3) var(--space-3) var(--cb-pad); border-radius: var(--radius-lg); background: var(--popover); color: var(--popover-foreground); box-shadow: var(--shadow-float); }
.cb-toast__icon { color: var(--cb-tone); }
.cb-toast.cb-tone--neutral .cb-toast__icon { color: var(--muted-foreground); }
.cb-toast__text { flex: 1; min-width: 0; }
.cb-toast__title { margin: 0; font-weight: 600; }
.cb-toast__desc { margin: 2px 0 0; color: var(--muted-foreground); font-size: calc(var(--cb-fs) * .9); }
.cb-toast__action { flex: none; }
.cb-toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--dock-h) + var(--space-6)); z-index: var(--z-toast); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); pointer-events: none; }
.cb-toasts > * { pointer-events: auto; animation: cb-toast-in .2s ease-out; }
.cb-toasts--contained { position: absolute; }
@keyframes cb-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .cb-toasts > * { animation: none; } }

/* ----------------------------------------------------------------- Sheet */
.cb-sheet {
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: var(--space-2) var(--cb-pad) var(--cb-pad); display: flex; flex-direction: column; gap: var(--cb-gap);
}
.cb-sheet__body { display: flex; flex-direction: column; gap: var(--cb-gap); min-width: 0; }
/* Modal sheet: bottom centre over its own scrim; the body scrolls when the sheet is taller than the space. */
.cb-scrim--sheet { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: var(--space-8) var(--space-3) 0; }
.cb-sheet-wrap { width: min(100%, var(--cb-sheet-w, 640px)); max-height: 100%; min-height: 0; display: flex; flex-direction: column; }
.cb-sheet-wrap .cb-sheet { min-height: 0; max-height: 100%; }
.cb-sheet-wrap .cb-sheet__body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; margin: 0 calc(var(--space-3) * -1); padding: 2px var(--space-3); }
.cb-sheet__grabber { align-self: center; width: 40px; height: 5px; border-radius: var(--radius-full); background: var(--input); margin-bottom: var(--space-1); }
.cb-sheet__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
.cb-sheet__title { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
.cb-sheet__desc { margin: 2px 0 0; color: var(--muted-foreground); }
.cb-sheet__foot { display: flex; gap: var(--space-2); justify-content: flex-end; }

/* ------------------------------------------------------------- SceneView */
.cb-scene { position: relative; overflow: hidden; background: var(--scene); border-radius: var(--radius-xl); }
.cb-scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cb-scene__edge { stroke: var(--scene-line); stroke-width: 2.5; stroke-linecap: round; }
.cb-scene__dash { stroke: var(--scene-line); stroke-linecap: round; }
.cb-scene__other { fill: var(--scene-object); }
.cb-scene__self { fill: var(--self); }
.cb-scene__halo { fill: var(--path); opacity: .28; }
.cb-scene__window { fill: var(--scene); opacity: .55; }
.cb-scene__path-stop { stop-color: var(--path); }
.cb-scene__overlay { position: absolute; inset: 0; padding: var(--cb-pad); pointer-events: none; }
.cb-scene__overlay > * { pointer-events: auto; }

/* ----------------------------------------------------------------- Shell */
.cb-shell {
  display: grid; gap: var(--space-3); padding: 0 var(--space-3) var(--space-3); box-sizing: border-box;
  grid-template-columns: 1fr var(--cb-aside-w); grid-template-rows: auto 1fr auto;
  grid-template-areas: "top top" "main aside" "bottom bottom"; background: var(--background);
}
.cb-shell--aside-start { grid-template-columns: var(--cb-aside-w) 1fr; grid-template-areas: "top top" "aside main" "bottom bottom"; }
.cb-shell__top { grid-area: top; min-width: 0; margin: 0 calc(var(--space-3) * -1); }
.cb-shell__main { grid-area: main; min-height: 0; min-width: 0; position: relative; }
.cb-shell__main > .cb-scene { position: absolute; inset: 0; height: auto !important; }
.cb-shell__aside { grid-area: aside; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--space-3); }
.cb-shell__bottom { grid-area: bottom; }
.cb-shell:not(:has(.cb-shell__aside)) { grid-template-columns: 1fr; grid-template-areas: "top" "main" "bottom"; }
@media (max-width: 720px) {
  .cb-shell, .cb-shell--aside-start { grid-template-columns: 1fr; grid-template-rows: auto minmax(220px, 1fr) auto auto; grid-template-areas: "top" "main" "aside" "bottom"; }
}

/* --------------------------------------------------------------- Desktop */
/* Kbd: keys as keycaps, modifiers as the Mac's glyphs. */
.cb-kbd { display: inline-flex; align-items: center; gap: 2px; font: inherit; vertical-align: middle; flex: none; }
.cb-kbd__key {
  display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-width: 1.75em; height: 1.75em; padding: 0 .4em;
  border-radius: calc(var(--radius-sm) / 2); background: var(--muted); color: var(--muted-foreground);
  box-shadow: inset 0 0 0 1px var(--border), inset 0 -1px 0 var(--border);
  font-family: var(--font-sans); font-size: calc(var(--cb-fs) * .78); font-weight: 500; line-height: 1; font-feature-settings: "tnum" 1;
}

/* In a button or a menu row the keys are plain glyphs in the label's colour, as a Mac button writes them (Replace ⌘↩). */
.cb-btn .cb-kbd { gap: 0; margin-left: var(--space-1); opacity: .72; }
.cb-btn .cb-kbd__key { min-width: 0; height: auto; padding: 0; background: none; box-shadow: none; color: inherit; font-size: .92em; }

/* Checkbox and RadioGroup: the box sits on the first line of its label. */
.cb-check { display: flex; align-items: flex-start; gap: var(--space-2); line-height: 1.45; padding-block: max(0px, calc((var(--cb-hmin) - var(--cb-fs) * 1.45) / 2)); }
.cb-check__box {
  all: unset; box-sizing: border-box; flex: none; cursor: pointer; position: relative; display: grid; place-items: center;
  width: calc(var(--cb-fs) * 1.2); height: calc(var(--cb-fs) * 1.2); margin-top: calc(var(--cb-fs) * .125);
  border-radius: calc(var(--radius-sm) / 2); background: var(--card); box-shadow: inset 0 0 0 1.5px var(--input);
  color: var(--primary-foreground); --cb-icon: calc(var(--cb-fs) * .95); transition: background-color .16s ease, box-shadow .16s ease;
}
.cb-check__box.is-on { background: var(--primary); box-shadow: none; }
.cb-check__box:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
.cb-check__box:disabled { cursor: not-allowed; opacity: .45; }
.cb-radio__dot { border-radius: var(--radius-full); }
.cb-radio__dot.is-on::after { content: ""; width: 38%; height: 38%; border-radius: var(--radius-full); background: var(--primary-foreground); }
.cb-check__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; cursor: pointer; }
.cb-check__label { font-weight: 500; }
.cb-check__desc { font-size: calc(var(--cb-fs) * .87); color: var(--muted-foreground); }
.cb-check.is-disabled .cb-check__text { cursor: not-allowed; color: var(--muted-foreground); }
.cb-radios { display: flex; flex-direction: column; gap: var(--space-3); }
.cb-radios--row { flex-direction: row; flex-wrap: wrap; column-gap: var(--space-5); }
/* Held or tapped: the whole row is the target, at least hit-min tall. */
.cb-glass .cb-check__box, [data-finish="glass"] .cb-check__box { background: var(--pane-well); }

/* ShortcutField: a field showing keycaps; recording rings it in the focus colour. */
.cb-shortcut { display: flex; align-items: center; gap: var(--space-1); }
.cb-shortcut__field {
  all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2);
  min-width: calc(var(--cb-h) * 4.5); height: var(--cb-h); padding: 0 calc(var(--cb-h) * .3); border-radius: var(--radius-md);
  background: var(--background); box-shadow: inset 0 0 0 1px var(--input); transition: box-shadow .16s ease;
}
[data-finish="desk"] .cb-shortcut__field { border-radius: var(--desk-radius-control); background: var(--card); }
.cb-shortcut__field:focus-visible { box-shadow: var(--focus-ring); }
.cb-shortcut__field.is-recording { box-shadow: inset 0 0 0 1.5px var(--ring), 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.cb-field--invalid .cb-shortcut__field { box-shadow: inset 0 0 0 1.5px var(--destructive); }
.cb-shortcut__field:disabled { cursor: not-allowed; opacity: .45; }
.cb-shortcut__placeholder { color: var(--muted-foreground); }
.cb-shortcut__field.is-recording .cb-shortcut__placeholder { color: var(--info); }

/* CommandPalette: a search field over a list of commands, high on the screen, solid like a menu. */
.cb-scrim--palette { place-items: start center; padding-top: 14vh; }
.cb-palette {
  width: min(100%, var(--cb-palette-w, 640px)); max-height: min(70vh, 560px); display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;
  background: var(--popover); color: var(--popover-foreground); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); text-align: left;
}
.cb-palette:focus { outline: none; }
.cb-palette__search { flex: none; display: flex; align-items: center; gap: var(--space-3); height: calc(var(--cb-h) * 1.5); padding: 0 var(--cb-pad); color: var(--muted-foreground); box-shadow: inset 0 -1px 0 var(--border); }
.cb-palette__search input { all: unset; flex: 1; min-width: 0; font: inherit; font-size: calc(var(--cb-fs) * 1.15); color: var(--foreground); }
.cb-palette__search input::placeholder { color: var(--muted-foreground); }
.cb-palette__list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-1); }
.cb-palette__group { padding: var(--space-2) var(--space-3) var(--space-1); font-size: calc(var(--cb-fs) * .8); font-weight: 600; color: var(--muted-foreground); }
.cb-palette__item {

   what fills. The .cb-lit-* / .cb-raised / .cb-well / .cb-cta / .cb-glow-fill utilities work alone too.

/* ---------------------------------------------------------- Glass finish */
/* Opt in with data-finish="glass" on any container (Shell takes finish="glass"). Panes of frosted glass over a
   coloured aura: cards, lists, tables, the dock and notices blur what is behind them (blur-pane), neutral controls
   are translucent and raised, tracks are cut in, the one action is the aqua-to-blue CTA, and whatever is on glows
   in its own colour. Secondary text is glass-muted-foreground throughout, held to 4.5:1 over every aura colour.
   It costs a backdrop blur per pane: right for a wall tablet, a phone or a desktop, wrong for an old WebView or a
   screen that animates under the panes (the treadmill's Chrome 80 stays on Lit). Without backdrop-filter, or when
   the person asks for less transparency, panes turn solid and the rest stays. Toasts stay opaque, as everywhere. */
[data-finish="glass"], [data-theme][data-finish="glass"], [data-finish="glass"] [data-theme] {

[data-finish="glass"] .cb-list:not(.cb-list--plain) .cb-list__rows, [data-finish="glass"] .cb-table:not(.cb-table--plain),

}

  box-shadow: inset 0 1px 0 var(--pane-edge), inset 0 0 0 1px color-mix(in srgb, var(--cb-tone-fill) calc(35% * var(--cb-tint)), transparent), 0 16px 36px -18px color-mix(in srgb, var(--cb-tone-fill) 60%, transparent);
  -webkit-backdrop-filter: blur(var(--blur-pane)) saturate(180%); backdrop-filter: blur(var(--blur-pane)) saturate(180%);
}
/* Menus and popovers are floating glass, the material sheets already use. */
.cb-menu[data-finish="glass"], .cb-popover[data-finish="glass"], [data-finish="glass"] .cb-menu, [data-finish="glass"] .cb-popover {
  background: linear-gradient(180deg, var(--glass-sheen), transparent 55%), var(--glass); box-shadow: var(--shadow-glass);
  -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(180%); backdrop-filter: blur(var(--blur-glass)) saturate(180%);
}
.cb-pane-raised, [data-finish="glass"] .cb-btn--secondary, [data-finish="glass"] .cb-stepper__btn,
[data-finish="glass"] .cb-tile:not(.is-on), [data-finish="glass"] .cb-keypad__key {
  background: var(--pane-raised); box-shadow: var(--shadow-pane-raised); border-color: transparent;
}
[data-finish="glass"] .cb-btn--secondary:hover:not(:disabled), [data-finish="glass"] .cb-tile:not(.is-on):hover,
[data-finish="glass"] .cb-stepper__btn:hover:not(:disabled), [data-finish="glass"] .cb-keypad__key:hover:not(:disabled) { background: var(--pane-active); }
.cb-pane-raised:active, [data-finish="glass"] .cb-btn--secondary:active:not(:disabled), [data-finish="glass"] .cb-stepper__btn:active:not(:disabled),
[data-finish="glass"] .cb-tile:not(.is-on):active, [data-finish="glass"] .cb-keypad__key:active:not(:disabled) { box-shadow: var(--shadow-pane-well); }
.cb-pane-well, [data-finish="glass"] .cb-seg, [data-finish="glass"] .cb-progress__track, [data-finish="glass"] .cb-meter__track,
[data-finish="glass"] .cb-zones__bar, [data-finish="glass"] .cb-switch { background: var(--pane-well); box-shadow: var(--shadow-pane-well); }
[data-finish="glass"] .cb-input { background: var(--pane-well); }

[data-finish="glass"] .cb-row.is-selected, [data-finish="glass"] .cb-dock__item.is-active { background: var(--pane-active); }

[data-finish="glass"] .cb-tile:disabled { background: var(--pane-well); box-shadow: none; }
[data-finish="glass"] .cb-thermo__arc:not(.cb-tone--neutral), [data-finish="glass"] .cb-gauge__fill { filter: drop-shadow(0 0 6px var(--cb-tone)); }
[data-finish="glass"] .cb-btn--default {
  background: var(--cta-fill); color: var(--cta-foreground); box-shadow: var(--shadow-cta); border-color: transparent;
}
[data-finish="glass"] .cb-btn--default:hover:not(:disabled) { background: var(--cta-fill-hover); }
[data-finish="glass"] .cb-progress.cb-tone--primary .cb-progress__bar, [data-finish="glass"] .cb-progress.cb-tone--info .cb-progress__bar { background: var(--glow-fill); box-shadow: var(--shadow-glow); }
[data-finish="glass"] .cb-switch.is-on { background: var(--cta-fill); box-shadow: var(--shadow-glow); }
[data-finish="glass"] .cb-switch__thumb { box-shadow: var(--shadow-thumb); }
[data-finish="glass"] .cb-slider input::-webkit-slider-runnable-track {
  background: linear-gradient(to right, var(--cta-to) 0%, var(--cta-from) var(--cb-fill), var(--pane-well) var(--cb-fill)); box-shadow: var(--shadow-pane-well);
}
[data-finish="glass"] .cb-slider input::-moz-range-track { background: var(--pane-well); box-shadow: var(--shadow-pane-well); }
[data-finish="glass"] .cb-slider input::-moz-range-progress { background: var(--glow-fill); }
[data-finish="glass"] .cb-slider input::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--cta), var(--shadow-glow); }
[data-finish="glass"] .cb-slider input::-moz-range-thumb { box-shadow: 0 0 0 3px var(--cta), var(--shadow-glow); }
[data-finish="glass"] .cb-slider[class*="cb-tone--"] input::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--cb-tone-fill) var(--cb-fill), var(--pane-well) var(--cb-fill)); }
[data-finish="glass"] .cb-slider[class*="cb-tone--"] input::-moz-range-progress { background: var(--cb-tone-fill); }

[data-finish="glass"] .cb-slider[class*="cb-tone--"] input::-moz-range-thumb { box-shadow: 0 0 0 3px var(--cb-tone-fill), 0 0 14px var(--cb-tone-fill); }
[data-finish="glass"] .cb-slider.cb-slider--kelvin input::-webkit-slider-runnable-track { background: var(--cb-track); }
[data-finish="glass"] .cb-slider.cb-slider--kelvin input::-moz-range-track { background: var(--cb-track); }
[data-finish="glass"] .cb-slider.cb-slider--kelvin input::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--foreground), var(--shadow-thumb); }
[data-finish="glass"] .cb-slider.cb-slider--kelvin input::-moz-range-thumb { box-shadow: 0 0 0 3px var(--foreground), var(--shadow-thumb); }
[data-finish="glass"] .cb-gauge.cb-tone--primary .cb-gauge__fill, [data-finish="glass"] .cb-gauge.cb-tone--info .cb-gauge__fill { stroke: var(--glow); }
[data-finish="glass"] .cb-tone--primary { --cb-tone: var(--glow); }
[data-finish="glass"] .cb-dock__item.is-active::after, [data-finish="glass"] .cb-tabs__tab.is-active::after { background: var(--glow); box-shadow: var(--shadow-glow); }
/* What the finish must not take away: disabled, focus, and glass's own controls. */
[data-finish="glass"] .cb-btn:disabled { background: var(--pane-well); color: var(--muted-foreground); box-shadow: none; }
[data-finish="glass"] .cb-btn:focus-visible, [data-finish="glass"] .cb-stepper__btn:focus-visible, [data-finish="glass"] .cb-tile:focus-visible,
[data-finish="glass"] .cb-seg__item:focus-visible, [data-finish="glass"] .cb-keypad__key:focus-visible { box-shadow: var(--focus-ring); }

  [data-finish="glass"] .cb-list:not(.cb-list--plain) .cb-list__rows, [data-finish="glass"] .cb-table:not(.cb-table--plain),

/* ------------------------------------------------------------------ Apps */
/* Web and Mac apps worked in all day (Linear's shape): the frame, the sidebar, the list, pickers, a calendar, panes,
   a tree. Row states come from three local values the Desk finish sets from its own tokens: hover, the open one
   (active) and the picked ones. Elsewhere they fall back to the theme's accent and secondary. */
.cb-app, .cb-side, .cb-lv, .cb-tree, .cb-picker, .cb-cal, .cb-table {

.cb-lv:focus .cb-lv__row.is-active { box-shadow: inset 2px 0 0 var(--ring), inset 0 -1px 0 var(--border); }
